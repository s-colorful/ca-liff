<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欠席・振替</title>
<script>window.__MOCK__ = false; window.__MOCK_ADMIN__ = false; /* GAS の doGet が ?mock=1 / ?admin=1 のとき true に書き換える */</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">
<style>
  /* ===== 配色「白と藍」：薄い灰の地に白い面。押せる場所は藍。フォントは Noto Sans JP ===== */
  :root{
    --font:"Noto Sans JP","Hiragino Sans",sans-serif;
    --bg:#f2f3f7; --surface:#ffffff; --head:rgba(242,243,247,.9); --muted:#eceef3;
    --ink:#1b1e27; --sub:#5f6577; --faint:#a4a9b6; --line:#e1e4ea;
    --accent:#3451c7; --accent-ink:#ffffff; --accent-tint:#e8ecfb; --accent-off:#b4bfeb;
    --open-bg:#fdefdf; --open-fg:#9a4a06; --done-bg:#e1f3ea; --done-fg:#1d6e4a;
    --danger:#c0341d; --cancel:#b8483c; --cancel-tint:#fbe9e6; --notice:#8a5300; --notice-tint:#fdf3e0;
    --dock:#1b1e27;
  }
  :root{--r:14px;--r-s:10px;--shadow:0 0 0 1px var(--line);color-scheme:light;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.6 var(--font);font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{-webkit-tap-highlight-color:transparent}
  .num,.ticket .date,.next .first,.cal .day,.slot .tm,.row .d,.row .t,.badge,.cell .tm,.rh b,.lesson .code{font-feature-settings:"tnum" 1}
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  /* ===== ヘッダー ===== */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);backdrop-filter:saturate(1.6) blur(10px);
    display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:16px;font-weight:700}
  header .who{margin-left:auto;font-size:13px;color:var(--sub)}
  header .back{border:0;background:none;padding:8px 8px 8px 0;font-size:15px;font-weight:700;color:var(--accent);cursor:pointer}
  main{padding:16px 16px 120px;flex:1}

  /* ===== 見出し・文 ===== */
  h2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:28px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
  h2:first-child{margin-top:4px}
  p.lead{margin:0 4px 14px;color:var(--sub);font-size:14px}
  .eyebrow{margin:4px 4px 2px;font-size:12px;font-weight:700;color:var(--sub)}
  .ptitle{margin:0 4px 6px;font-size:22px;line-height:1.35;font-weight:700}
  .ptitle .no{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .psub{margin:0 4px 12px;font-size:13px;color:var(--sub)}
  .pdesc{margin:12px 0;padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);line-height:1.8}
  .curnote{margin:20px 4px 0;font-size:12px;color:var(--faint)}

  /* ===== 一覧（グループにまとめた行）：保護者・管理者・カリキュラムで共通 ===== */
  .group{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .group + .group{margin-top:12px}
  .cell{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:11px 16px;border:0;background:none;text-align:left;cursor:pointer}
  .cell + .cell::before,.row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
  button.cell:active{background:var(--muted)}
  .cell .ct{flex:1;min-width:0;display:flex;flex-direction:column}
  .cell .ct b{font-size:15px;font-weight:700;line-height:1.45}
  .cell .ct small{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:1px}
  .cell .cv{flex:none;font-size:14px;color:var(--sub);white-space:nowrap}
  .cell .chev{flex:none;width:8px;height:8px;margin:0 2px 0 -2px;border:solid var(--faint);border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
  .cell.static{cursor:default}
  .cell.minor{min-height:44px}
  .cell.minor .ct{font-size:14px;color:var(--sub)}
  .cell .tm{flex:none;width:7.2em;font-weight:700}
  .badge{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:9px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);font-size:14px;font-weight:700}
  .badge.alt{background:var(--notice-tint);color:var(--notice)}
  .badge.ghost{background:var(--muted);color:var(--sub);font-size:11px}
  .group > .empty{border-radius:0;box-shadow:none}

  .empty{padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);color:var(--sub);font-size:14px}
  .loading{padding:40px 0;text-align:center;color:var(--sub);font-size:14px}

  /* ===== ボタン ===== */
  .btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;line-height:1.3}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:disabled{background:var(--accent-off);border-color:var(--accent-off);color:#fff}
  .btn.quiet{border-color:transparent;background:none;color:var(--accent);padding:6px 8px}
  .btn.small{padding:6px 10px;font-size:13px}
  .btn.icon{width:44px;height:44px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}
  .btn.danger{color:var(--danger)}
  .link{border:0;background:none;padding:6px 0 0;font-size:13px;color:var(--cancel);text-decoration:underline;text-decoration-color:var(--cancel-tint);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer}
  .link.danger{color:var(--danger)}
  :is(.btn,.tab,.link,.back,.day,.slot,.cell,.seg button,.link-ish):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* 画面下の主ボタン */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .dock .btn{width:100%;max-width:528px;padding:15px;font-size:16px;border-radius:var(--r);background:var(--dock);border-color:var(--dock);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .dock .btn:disabled{background:var(--faint);border-color:var(--faint);box-shadow:none}

  /* ===== 切り替え（きょうだい・章） ===== */
  .tabs,.seg{display:flex;gap:3px;padding:3px;margin:0 0 16px;border-radius:12px;background:var(--muted)}
  .tab,.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;line-height:1.3}
  .seg button small{display:block;font-size:11px;font-weight:500}
  .tab[aria-selected="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* ===== 保護者ホーム ===== */
  .next{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--accent)}
  .next .first{font-size:24px;font-weight:700;line-height:1.3}
  .next .rest{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--sub)}
  .next .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:3px;background:var(--accent-tint);color:var(--accent)}
  .next .rest .tag{vertical-align:1px}

  .list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .list > .empty{border-radius:0;box-shadow:none}
  .ticket{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px}
  .ticket + .ticket::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
  .ticket .body{flex:1;min-width:0}
  .ticket .date{font-size:17px;font-weight:700;line-height:1.35}
  .ticket .sub{font-size:13px;color:var(--sub);margin-top:3px}
  .ticket .sub b{color:var(--ink)}
  .ticket .sub .arrow{margin-right:4px}
  .ticket .acts{flex:none}
  .chip{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:1px}
  .chip.open{background:var(--open-bg);color:var(--open-fg)}
  .chip.done{background:var(--done-bg);color:var(--done-fg)}

  /* ===== 欠席する日の選択 ===== */
  .row{position:relative;display:flex;align-items:center;gap:14px;min-height:52px;padding:12px 16px;cursor:pointer}
  .row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:1.5px solid var(--faint);border-radius:7px;display:grid;place-items:center;background:var(--surface)}
  .row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .row input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
  .row .d{font-size:16px;font-weight:700;min-width:6.2em}
  .row .t{font-size:15px;color:var(--sub)}
  .row.past .d{color:var(--sub);font-weight:500}
  .row .note{margin-left:auto;font-size:12px;color:var(--sub)}
  .row.disabled{opacity:.45;cursor:default}
  .olderbtn{display:block;width:100%;margin:0 0 12px;padding:12px 0;border:1px dashed var(--faint);border-radius:var(--r);background:none;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer}
  .monthhead{margin:16px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
  .older + .group{margin-top:16px}

  /* ===== 入力欄 ===== */
  label.f{display:block;margin:24px 4px 8px;font-size:13px;font-weight:700;color:var(--sub)}
  textarea,input[type=date],select,.search{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:12px;background:var(--surface);font-size:16px}
  textarea{min-height:88px;resize:vertical}
  textarea:focus,select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .searchbar{display:flex;gap:8px;margin:0 0 16px}
  .searchbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;background:var(--surface);font-size:16px}
  .searchbar .btn{flex:none;padding:10px 16px}

  /* ===== カレンダーと時限 ===== */
  .cal{margin-bottom:12px;padding:12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  .cal .m{margin:2px 4px 6px;font-size:15px;font-weight:700}
  .cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
  .cal .wd.sun{color:var(--cancel)}.cal .wd.sat{color:var(--accent)}
  .cal .day{height:42px;border:0;border-radius:var(--r-s);background:none;font-size:15px;font-weight:700;cursor:pointer}
  .cal .day:not(:disabled):hover{background:var(--muted)}
  .cal .day:disabled{color:var(--faint);opacity:.6;font-weight:400;cursor:default}
  .cal .day.today{box-shadow:inset 0 0 0 1.5px var(--faint)}
  .cal .day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:none}
  .cal .day.blank{visibility:hidden}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .slot{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);text-align:left;cursor:pointer}
  .slot .tm{font-size:20px;font-weight:700;line-height:1.2}
  .slot .st{margin-top:4px;font-size:12px;color:var(--sub)}
  .slot.gray .st,.slot.memo .st{color:var(--notice)}
  .slot.ng{background:var(--muted);border-color:transparent;color:var(--faint);cursor:default}
  .slot.ng .st{color:var(--faint)}
  .slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
  .slotarea{margin-top:8px;min-height:calc(100dvh - 180px);scroll-margin-top:68px}
  .slotarea:empty{min-height:0}
  .warn{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--notice-tint);color:var(--notice);font-size:13px}

  /* ===== 確認パネル・通知 ===== */
  .sheet{position:fixed;inset:0;z-index:10;background:rgba(20,22,30,.4);display:flex;align-items:flex-end;justify-content:center}
  .sheet .card{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px calc(16px + env(safe-area-inset-bottom,0px))}
  .sheet h3{margin:0 0 8px;font-size:18px;font-weight:700}
  .sheet .card p{margin:0 0 20px;font-size:15px;color:var(--sub)}
  .sheet .card .btn{width:100%;padding:14px;margin-top:8px;font-size:16px;border-radius:var(--r)}
  .sheet .card .btn:not(.primary){border-color:transparent;background:none;color:var(--sub)}
  .sheet .card .btn.primary.cancel{background:var(--cancel);border-color:var(--cancel)}
  #toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;transform:translate(-50%,8px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;width:max-content;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .mock{background:var(--notice-tint);color:var(--notice);font-size:12px;text-align:center;padding:5px}

  /* ===== 管理者 ===== */
  .adm{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:16px;padding:10px 14px;border-radius:var(--r-s);background:var(--notice-tint);font-size:13px;color:var(--notice)}
  .adm .btn{margin-left:auto}
  .arow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .pickbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .pickbar select{width:auto;min-width:7em;font-weight:700}
  .room{font-size:13px;color:var(--sub)}
  .search{margin-bottom:12px}
  .issue{margin-bottom:8px;padding:10px 12px;border-radius:var(--r-s);background:var(--notice-tint);color:var(--notice);font-size:13px}
  .issue b{font-weight:700}

  /* 日別の出欠 */
  .daynav{display:flex;align-items:center;gap:10px}
  .dpick{position:relative;flex:1;height:44px;display:grid;place-items:center;border-radius:var(--r-s);background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:700;cursor:pointer}
  .dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
  .todaybtn{display:block;margin:6px auto 0}
  .daysum{margin:14px 4px 10px;font-size:13px;color:var(--sub)}
  .daysum b{font-size:16px;color:var(--ink)}
  .rslot{margin-bottom:12px;padding:12px 16px 12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .rh b{font-size:18px;margin-right:auto}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:2px 9px;border-radius:999px;background:var(--muted);color:var(--sub);font-size:12px;font-weight:700}
  .pill.abs{background:var(--cancel-tint);color:var(--cancel)}
  .pill.tr{background:var(--accent-tint);color:var(--accent)}
  .rl{list-style:none;margin:10px 0 0;padding:0}
  .rl li{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:7px 0;border-top:1px solid var(--line)}
  .rl .k{flex:none;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;line-height:1.8}
  .rl .abs .k{background:var(--cancel-tint);color:var(--cancel)}
  .rl .tr .k{background:var(--accent-tint);color:var(--accent)}
  .rl .nm{font-weight:700;font-size:15px}
  .link-ish{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:3px}
  .rl .meta{font-size:12.5px;color:var(--sub)}
  .pres{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--sub);line-height:1.7}

  /* ===== カリキュラム ===== */
  .cathead{margin-top:24px}
  .catmeta{margin:-4px 4px 8px;font-size:12px;color:var(--sub);line-height:1.6}
  .curbar{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:8px}
  .curbar i{height:8px;border-radius:2px;background:var(--muted)}
  .curbar i.on{background:var(--accent-off)}
  .curbar i.here{background:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
  .curbar i.gap{margin-left:6px}
  .progress{margin:10px 0 16px;padding:12px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  .progress .s{font-size:12.5px;color:var(--sub)}
  ol.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .lesson{padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);scroll-margin-top:80px}
  .lesson.here{box-shadow:0 0 0 2px var(--accent)}
  .lesson .lh{display:flex;align-items:baseline;gap:10px}
  .lesson .code{flex:none;padding:1px 8px;border-radius:7px;background:var(--accent-tint);color:var(--accent);font-size:13px;font-weight:700}
  .lesson .lh b{font-size:15px;line-height:1.5}
  .lesson .sh{margin-top:6px;font-size:12.5px;color:var(--sub)}
  .lesson p{margin:6px 0 0;font-size:14px;line-height:1.8}
  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .pager .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  dl.gloss{margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
  dl.gloss > div{padding:14px 16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  dl.gloss dt{font-weight:700}
  dl.gloss dd{margin:4px 0 0;font-size:14px;color:var(--sub);line-height:1.8}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <div id="mockbar" class="mock" hidden>モック表示中：LINEに接続していません。データは架空です。</div>
  <header><button class="back" id="back" hidden aria-label="前の画面に戻る">‹ 戻る</button><h1>欠席・振替</h1><span class="who" id="who"></span></header>
  <main id="view"><div class="loading">読み込み中…</div></main>
</div>
<div id="toast" role="status"></div>

<script>
// =============================================================
// 設定
// =============================================================
const LIFF_ID = '2011756125-bAh93kVs';   // LINEログインチャネル > LIFF で発行される ID
const API_URL = 'https://script.google.com/macros/s/AKfycbwuH-fKM32HKDdRvK1PZDwoW413-jitvomI6Rc76W8TQwgbEpIre8ubIXc3eIRuSciA/exec';   // GAS の Web アプリ URL（外部ホスティング時に使用）
const MOCK = window.__MOCK__ === true || /[?&]mock=1/.test(location.search) || (typeof liff === 'undefined' && !window.google);

// =============================================================
// API 層（LIFF → GAS）
// =============================================================
let idToken = null;
/** 一定時間で終わらない処理をエラーにする（どこで止まったか画面に出すため） */
function withTimeout(promise, ms, label) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))]);
}
const API_TIMEOUT_MS = 60000;   // 書き込み（やり直さない）
const READ_TRY_MS = 25000;      // 読み込み1回あたり
let LAST_TIMING = '';           // 直近の通信の所要時間（管理者画面の下に表示。原因の切り分け用）
const TIMINGS = [];             // 直近の通信の記録（管理者のときだけ画面の最下部に出す）
function noteTiming(line) {
  LAST_TIMING = line;
  TIMINGS.unshift(line); TIMINGS.length = Math.min(TIMINGS.length, 6);
  let el = document.getElementById('timings');
  if (!el) { el = document.createElement('div'); el.id = 'timings'; el.style.cssText = 'padding:8px 16px 96px;font-size:11px;line-height:1.6;color:var(--sub)'; document.body.appendChild(el); }
  el.hidden = !S.admin || S.preview;
  el.textContent = '通信の記録（新しい順）\n' + TIMINGS.join('\n');
  el.style.whiteSpace = 'pre-line';
}
const hms = d => d.toTimeString().slice(0, 8);   // Apps Script は起動直後に時間がかかることがあるため、長めに待つ
// 読み込みだけの操作。通信の失敗時は1回だけ自動でやり直す（書き込みは二重登録を避けるため、やり直さない）
const READ_ACTIONS = ['curriculumText', 'home', 'dayRoster', 'candidates', 'transferDates', 'availability', 'ledgerOf', 'adminOverview', 'adminStudents', 'previewHome', 'integrity', 'enrollOptions', 'planMove', 'planEnroll', 'planWithdraw'];
async function api(action, params = {}) {
  if (MOCK) return mockApi(action, params);
  const body = { action, params, idToken };
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(s => { const r = JSON.parse(s); r.ok ? res(r.result) : rej(new Error(r.error)); })
      .withFailureHandler(e => rej(e)).apiEntry(JSON.stringify(body)));
  }
  const isRead = READ_ACTIONS.includes(action);
  // 読み込みは最大3回まで自動でやり直す（Google側で応答を受け取れない回に当たっても開けるように）
  const tries = isRead ? 3 : 1;
  for (let i = 0; ; i++) {
    try {
      return await callServer(action, body, isRead ? READ_TRY_MS : API_TIMEOUT_MS);
    } catch (e) {
      const transient = /^(TIMEOUT|BAD_RESPONSE|NETWORK):/.test(e.message);
      if (!transient) throw e;
      // 書き込みは、サーバーでは処理が済んでいて結果だけ受け取れなかった可能性がある。やり直さず「確認してください」にする
      if (!isRead) throw new Error(`UNCERTAIN:${e.message}`);
      if (i >= tries - 1) throw e;
      console.warn('[api] retry', action, i + 1, e.message);
      await new Promise(r => setTimeout(r, 1000 * (i + 1)));
    }
  }
}
async function callServer(action, body, limitMs) {
  // 待ち時間が長いときは、読み込み表示に経過秒数を出す（止まっているのか待っているのかを区別できるように）
  const t0 = Date.now();
  const tick = setInterval(() => {
    const el = $view.querySelector('.loading');
    const sec = Math.round((Date.now() - t0) / 1000);
    if (el && sec >= 5) el.textContent = `サーバーの応答を待っています（${sec}秒）…`;
  }, 1000);
  let r, text, tHead = 0;
  const sent = new Date();
  const ctrl = window.AbortController ? new AbortController() : null;
  const sec = ms => (ms / 1000).toFixed(1) + '秒';
  try {
    const p = fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined }) // text/plain で送り、プリフライトを避ける
      .then(res => { tHead = Date.now() - t0; return res; });
    r = await withTimeout(p, limitMs, 'TIMEOUT');
    text = await withTimeout(r.text(), limitMs, 'TIMEOUT');
  } catch (e) {
    if (ctrl) ctrl.abort();
    noteTiming(`${action} 送信 ${hms(sent)} → ${sec(Date.now() - t0)}で打ち切り`);
    throw new Error(e.message === 'TIMEOUT' ? `TIMEOUT:${action}（送信 ${hms(sent)}）` : `NETWORK:${action}:${e.message}`);
  } finally { clearInterval(tick); }
  let j;
  try { j = JSON.parse(text); } catch (e) {
    // Google のエラーページが返ってきた場合は、その題名を添える（原因の切り分け用）
    const title = (text.match(/<title>([^<]*)<\/title>/i) || [])[1] || '';
    throw new Error(`BAD_RESPONSE:${action}:HTTP ${r.status}${title ? ' ' + title.trim().slice(0, 40) : ''}`);
  }
  noteTiming(`${action} 送信 ${hms(sent)} / 応答 ${sec(tHead)} / 受信完了 ${sec(Date.now() - t0)}` + (typeof j.ms === 'number' ? `（うちサーバー処理 ${sec(j.ms)}）` : ''));
  console.log('[api]', LAST_TIMING);
  if (!j.ok) throw new Error(j.error);
  return j.result;
}

// =============================================================
// 状態と描画
// =============================================================
const S = { students: [], ledger: [], nextLessons: {}, cur: null, openCount: 0, admin: null, adminStudents: [], preview: false };
const $view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function busy(msg = '処理中…') { $view.innerHTML = `<div class="loading">${esc(msg)}</div>`; }
const $back = document.getElementById('back');

// ---------- 画面遷移（アプリ内で積み上げて管理。ブラウザ履歴には頼らない） ----------
const NAV = [];            // 今の画面より前の画面（{ name, redraw }）
let CURRENT = null;        // 今の画面
let restoring = false;     // 戻る操作で再描画している最中
let ignorePop = false;     // 画面上の「戻る」に伴う popstate を無視するため

/** ホーム系の画面：遷移の履歴をリセットする */
function setRoot(name, redraw) {
  NAV.length = 0;
  CURRENT = { name, redraw };
  $back.hidden = !S.preview;   // プレビュー中はホームから管理者メニューへ戻れるようにする
}
/** サブ画面に入る。同じ画面が履歴にあればそこまで巻き戻す */
function enter(name, redraw) {
  if (!restoring) {
    const idx = NAV.findIndex(n => n.name === name);
    if (idx >= 0) NAV.length = idx;
    else if (CURRENT && CURRENT.name !== name) NAV.push(CURRENT);
    try { history.pushState({ screen: name }, ''); } catch (e) {}
  }
  CURRENT = { name, redraw };
  $back.hidden = false;
}
/** 一つ前の画面に戻る */
function goBack() {
  const prev = NAV.pop();
  if (!prev) {
    if (S.preview) return exitPreview();
    return S.admin && !S.preview ? renderAdminHome() : renderHome();
  }
  restoring = true;
  try { CURRENT = prev; prev.redraw(); } finally { restoring = false; }
}
$back.onclick = () => {
  goBack();
  // 端末の戻るボタン用に積んだ履歴も一つ戻す（その popstate は無視する）
  ignorePop = true; setTimeout(() => { ignorePop = false; }, 600);
  try { history.back(); } catch (e) {}
};
window.addEventListener('popstate', () => { if (ignorePop) { ignorePop = false; return; } goBack(); });

function fail(e) { console.error(e); toast(messageFor(e.message)); }
function messageFor(code) {
  code = String(code || '');
  // 通信まわりの失敗は「何が起きたか」と、教室に伝えるための記号を添える
  if (code.startsWith('TIMEOUT:')) return `サーバーの応答に時間がかかっています。少し待ってから、もう一度読み込んでください。（${code}）`;
  if (code.startsWith('NETWORK:')) return `サーバーにつながりませんでした。通信環境を確認して、もう一度読み込んでください。（${code}）`;
  if (code.startsWith('BAD_RESPONSE:')) return `通信が不安定で、サーバーの応答を受け取れませんでした。少し待ってから、もう一度読み込んでください。（${code}）`;
  if (code.startsWith('UNCERTAIN:')) return '通信が不安定で、結果を受け取れませんでした。登録や取り消しが反映されているか、一覧で確認してください。';
  return ({
    NOT_REGISTERED: 'このLINEアカウントは教室に登録されていません。教室までご連絡ください。',
    busy: '混み合っています。少し待ってからもう一度お試しください。',
    DUPLICATE: 'その日時は既に登録されています。',
    FULL: 'その時限は満員です。別の時限を選んでください。',
    NO_SHEET: 'その月の時間割がまだ用意されていません。教室で確認して連絡します。',
    CLOSED: 'その日は休校日のため振り替えできません。',
    SLOT_CLOSED: 'その時限は現在開講していないため振り替えできません。',
  })[code] || `処理できませんでした（${code}）。教室までご連絡ください。`;
}

async function reload() {
  if (S.preview) return startPreview(S.previewStudent);
  if (S.admin) { const id = S.cur; S.admin = (await api('home')); S.adminStudents = S.admin.students || []; return id ? renderAdminStudent(id) : renderAdminHome(); }
  return loadHome();
}

async function loadHome() {
  busy('読み込み中…');
  try {
    const h = await api('home');
    if (h.admin) { S.admin = h; S.adminStudents = h.students || []; renderAdminHome(); return; }
    S.students = h.students; S.ledger = h.ledger; S.nextLessons = h.nextLessons || {}; S.openCount = h.openCount || 0;
    if (!S.cur || !S.students.some(s => s.id === S.cur)) S.cur = S.students[0]?.id || null;
    renderHome();
    prefetchCandidates(S.cur);
  } catch (e) {
    $view.innerHTML = `<div class="empty">${esc(messageFor(e.message))}</div><p style="margin-top:16px"><button class="btn primary" id="retry">もう一度読み込む</button></p>`;
    document.getElementById('retry').onclick = loadHome;
  }
}

function renderHome() {
  setRoot('home', renderHome);
  const st = S.students.find(s => s.id === S.cur);
  document.getElementById('who').textContent = st ? `${st.name}さん${S.preview ? '（プレビュー）' : ''}` : '';
  const mine = S.ledger.filter(r => r.studentId === S.cur);
  const open = mine.filter(r => r.status === '未振替').sort((a, b) => a.date.localeCompare(b.date));
  const done = mine.filter(r => r.status === '振替済').sort((a, b) => b.transferDate.localeCompare(a.transferDate));

  let html = '';
  if (S.preview) html += `<div class="adm">プレビュー（閲覧のみ）</div>`;
  if (S.students.length > 1) {
    html += `<div class="tabs" role="tablist">${S.students.map(s => `<button class="tab" role="tab" aria-selected="${s.id === S.cur}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>`;
  }
  const nx = S.nextLessons[S.cur] || [];
  const tag = l => l.kind === 'transfer' ? `<span class="tag">振替${l.forStudentId && l.forStudentId !== S.cur ? '・' + esc(S.students.find(s => s.id === l.forStudentId)?.name || '') + 'の分' : ''}</span>` : '';
  html += `<h2>次の授業</h2>`;
  html += nx.length
    ? `<div class="next"><div class="first">${esc(nx[0].label)} ${esc(nx[0].time)}${tag(nx[0])}</div>${nx.length > 1 ? `<div class="rest">${nx.slice(1).map(l => `<span>${esc(l.label)} ${esc(l.time)}${tag(l)}</span>`).join('')}</div>` : ''}</div>`
    : `<div class="empty">予定されている授業がありません</div>`;
  html += `<h2><span>振替がまだの欠席</span>${open.length ? `<span>${open.length}件</span>` : ''}</h2>`;
  html += open.length ? `<div class="list">${open.map(r => ticket(r)).join('')}</div>` : `<div class="list"><div class="empty">振替待ちの欠席はありません</div></div>`;
  if (done.length) {
    html += `<h2><span>振替が決まっている欠席</span><span>${done.length}件</span></h2><div class="list">${done.map(r => ticket(r)).join('')}</div>`;
  }
  html += `<h2>カリキュラム</h2><div class="group"><button class="cell" id="goCur"><span class="ct"><b>カリキュラム一覧</b><small>全30ステージの学習内容</small></span><i class="chev"></i></button></div>`;
  html += `<div class="dock"><button class="btn primary" id="goAbs">欠席を連絡する</button></div>`;
  $view.innerHTML = html;
  document.getElementById('goCur').onclick = () => renderCurriculum();

  $view.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.cur = b.dataset.id; renderHome(); });
  document.getElementById('goAbs').onclick = () => renderAbsence();
  $view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => onTicketAction(b.dataset.act, b.dataset.id));
}

function ticket(r) {
  const done = r.status === '振替済';
  const other = r.attendStudentId && r.attendStudentId !== r.studentId ? `（${esc(r.attendStudentName)}さんが出席）` : '';
  const title = done ? `${esc(r.dateLabel)} ${esc(r.time)} の欠席` : `${esc(r.dateLabel)} ${esc(r.time)}`;
  const sub = done
    ? `<span class="chip done">振替済</span><span class="arrow" aria-hidden="true">→</span><b>${esc(r.transferDateLabel)} ${esc(r.transferTime)}</b> に振替${other}`
    : `<span class="chip open">振替待ち</span>`;
  const main = done
    ? `<button class="btn" data-act="change" data-id="${esc(r.id)}">変更</button>`
    : `<button class="btn primary" data-act="transfer" data-id="${esc(r.id)}">振替を入れる</button>`;
  const second = done
    ? `<button class="link" data-act="cancelTransfer" data-id="${esc(r.id)}">振替を取り消す</button>`
    : `<button class="link" data-act="cancelAbsence" data-id="${esc(r.id)}">欠席を取り消す</button>`;
  return `<div class="ticket ${done ? 'done' : ''}"><div class="body"><div class="date">${title}</div><div class="sub">${sub}</div>${second}</div><div class="acts">${main}</div></div>`;
}

function onTicketAction(act, id) {
  const r = S.ledger.find(x => x.id === id);
  if (!r) return;
  if (act === 'transfer' || act === 'change') return renderTransfer(r);
  if (act === 'cancelTransfer') return confirmSheet('振替を取り消しますか', `${r.transferDateLabel} ${r.transferTime} の振替を取り消し、欠席は「振替待ち」に戻ります。`, '振替を取り消す', async () => {
    await api('cancelTransfer', { absenceId: id }); toast('振替を取り消しました'); await reload();
  }, { cancel: true });
  if (act === 'cancelAbsence') return confirmSheet('欠席の連絡を取り消しますか', `${r.dateLabel} ${r.time} は通常どおり出席する扱いになります。`, '欠席を取り消す', async () => {
    await api('cancelAbsence', { absenceId: id }); toast('欠席を取り消しました'); await reload();
  }, { cancel: true });
}

// ---------- 欠席連絡 ----------
// 欠席の候補日は、生徒の画面を開いた時点で裏で取りに行っておく（「欠席を連絡する」を押してからの待ち時間を減らすため）
let CAND = null;   // { studentId, promise }
function prefetchCandidates(studentId) {
  if (MOCK || !studentId) return;
  const promise = api('candidates', { studentId });
  promise.catch(() => {});   // 失敗したときは、画面を開いたときに取り直す
  CAND = { studentId, promise };
}
async function renderAbsence() {
  enter('absence', renderAbsence);
  busy('読み込み中…');
  let cands;
  try {
    const pre = CAND && CAND.studentId === S.cur ? CAND.promise : null;
    CAND = null;   // 使うのは1回だけ（登録後は最新を取り直す）
    cands = pre ? await pre.catch(() => api('candidates', { studentId: S.cur })) : await api('candidates', { studentId: S.cur });
  } catch (e) { fail(e); return renderHome(); }
  const st = S.students.find(s => s.id === S.cur);
  const byDate = {};
  // recent が無い（古いサーバー）ときは、すべて最初から表示する
  cands.forEach(c => (byDate[c.date] = byDate[c.date] || { label: c.label, isPast: c.isPast, recent: c.recent !== false, items: [] }).items.push(c));
  const dates = Object.keys(byDate).sort();
  const rowsHtml = list => list.map(d => {
    const g = byDate[d];
    return g.items.map((c, i) => {
      const dis = c.alreadyRequested;
      return `<label class="row ${g.isPast ? 'past' : ''} ${dis ? 'disabled' : ''}">
        <input type="checkbox" data-date="${esc(c.date)}" data-time="${esc(c.time)}" ${dis ? 'disabled' : ''}>
        <span class="d">${i === 0 ? esc(g.label) : ''}</span><span class="t">${esc(c.time)}</span>
        ${dis ? '<span class="note">連絡済み</span>' : (g.isPast ? '<span class="note">過去</span>' : '')}
      </label>`;
    }).join('');
  }).join('');
  // 直近より前の日付は月ごとにまとめて隠し、「さらに前を表示」を押すたびに1か月ずつ開く
  const olderByMonth = {};
  dates.filter(d => !byDate[d].recent).forEach(d => (olderByMonth[d.slice(0, 7)] = olderByMonth[d.slice(0, 7)] || []).push(d));
  const olderMonths = Object.keys(olderByMonth).sort();
  const ymJa = ym => `${+ym.slice(0, 4)}年${+ym.slice(5, 7)}月`;

  let html = `<h2>${esc(st.name)}さんの欠席する日</h2>`;
  if (olderMonths.length) html += `<button class="olderbtn" id="older" type="button"></button>`;
  html += olderMonths.map(ym => `<div class="older" data-ym="${ym}" hidden><div class="monthhead">${ymJa(ym)}</div><div class="group">${rowsHtml(olderByMonth[ym])}</div></div>`).join('');
  if (dates.some(d => byDate[d].recent)) html += `<div class="group">${rowsHtml(dates.filter(d => byDate[d].recent))}</div>`;
  if (!dates.length) html += `<div class="empty">選べる授業日がありません。教室までご連絡ください。</div>`;
  html += `<label class="f" for="notes">教室への伝言（任意）</label><textarea id="notes" placeholder="例：発熱のため。振替は来週以降で相談したいです"></textarea>`;
  html += `<div class="dock"><button class="btn primary" id="send" disabled>欠席を連絡する</button></div>`;
  $view.innerHTML = html;

  const olderBtn = document.getElementById('older');
  if (olderBtn) {
    const hiddenOlder = () => [...$view.querySelectorAll('.older[hidden]')];
    const label = () => {
      const h = hiddenOlder();
      if (!h.length) { olderBtn.remove(); return; }
      olderBtn.textContent = `さらに前の日付を表示（${ymJa(h[h.length - 1].dataset.ym)}）`;
    };
    olderBtn.onclick = () => { const h = hiddenOlder(); if (h.length) h[h.length - 1].hidden = false; label(); };
    label();
  }
  const send = document.getElementById('send');
  const picked = () => [...$view.querySelectorAll('input[type=checkbox]:checked')].map(c => ({ date: c.dataset.date, time: c.dataset.time }));
  $view.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    // 同じ日の他のコマも一緒に選ぶ（2コマ契約の生徒向け）。外すときは個別
    if (c.checked) $view.querySelectorAll(`input[data-date="${c.dataset.date}"]:not(:disabled)`).forEach(o => o.checked = true);
    const n = picked().length; send.disabled = !n; send.textContent = n ? `${n}コマの欠席を連絡する` : '欠席を連絡する';
  });
  send.onclick = () => {
    const list = picked();
    const text = list.map(p => `${byDate[p.date].label} ${p.time}`).join('、');
    confirmSheet('この内容で連絡します', text, '欠席を連絡する', async () => {
      const notes = document.getElementById('notes').value.trim();
      let ok = 0, dup = 0;
      for (const p of list) {
        const r = await api('absence', { studentId: S.cur, date: p.date, time: p.time, notes });
        if (r.code === 'OK') ok++; else if (r.code === 'DUPLICATE') dup++; else throw new Error(r.code);
      }
      toast(dup ? `${ok}コマを連絡しました（${dup}コマは連絡済み）` : `${ok}コマの欠席を連絡しました`);
      await reload();
    });
  };
}

// ---------- 振替 ----------
async function renderTransfer(r) {
  enter('transfer', () => renderTransfer(r));
  busy('読み込み中…');
  let dates;
  try { dates = await api('transferDates'); } catch (e) { fail(e); return renderHome(); }
  const st = S.students.find(s => s.id === r.studentId);
  const siblings = S.students.filter(s => s.id !== r.studentId);
  let html = `<h2>${esc(r.dateLabel)} ${esc(r.time)} 欠席の振替先</h2>
    ${r.status === '振替済' ? `<p class="lead">現在：${esc(r.transferDateLabel)} ${esc(r.transferTime)}</p>` : ''}`;
  if (siblings.length) {
    html += `<label class="f" for="attend">出席する生徒</label><select id="attend">
      <option value="${esc(r.studentId)}">${esc(st.name)}（本人）</option>${siblings.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>`;
  }
  // 過去の月（記入漏れの後追い用）があれば、年月のプルダウンで切り替える。最初は「今月以降」
  const todayIso = dates.today || isoLocal(new Date());
  const thisYm = todayIso.slice(0, 7);
  const pastYms = monthsBetween(dates.start, todayIso).filter(ym => ym < thisYm).reverse();
  html += `<label class="f" ${pastYms.length ? 'for="calm"' : ''}>振替する日</label>`;
  if (pastYms.length) {
    html += `<select id="calm" aria-label="表示する月" style="margin-bottom:10px"><option value="">今月以降</option>${pastYms.map(ym => `<option value="${ym}">${+ym.slice(0, 4)}年${+ym.slice(5, 7)}月</option>`).join('')}</select>`;
  }
  html += dates.dates.length ? calendarHtml(dates) : `<div class="empty">いま選べる日がありません。教室までご連絡ください。</div>`;
  html += `<div id="slots" class="slotarea"></div>`;
  html += `<div class="dock"><button class="btn primary" id="book" disabled>この日時に振り替える</button></div>`;
  $view.innerHTML = html;

        book.textContent = chosen.past ? 'この日時の振替を記録する' : 'この日時に振り替える';
        // 兄弟がいて、未振替が2件以上あり、残り1枠のときは注意を出す（過去の日の記録では出さない）
        const old = $slots.querySelector('.warn'); if (old) old.remove();
        if ((!S.admin || S.preview) && !chosen.past && S.students.length > 1 && S.openCount > 1 && chosen.free === 1) {
          const w = document.createElement('div'); w.className = 'warn';

  }
  $view.querySelectorAll('.cal .day:not(:disabled)').forEach(c => c.onclick = () => {
    $view.querySelectorAll('.cal .day').forEach(o => o.setAttribute('aria-pressed', 'false'));

  });
  /** 年月プルダウン：空＝今月以降をすべて、年月＝その月だけを表示 */
  const calm = document.getElementById('calm');
  const showMonths = () => {
    const ym = calm ? calm.value : '';
    $view.querySelectorAll('.cal[data-ym]').forEach(c => { c.hidden = ym ? c.dataset.ym !== ym : c.dataset.ym < thisYm; });
  };
  if (calm) calm.onchange = () => {
    showMonths();
    chosen = null; pickedDate = null; book.disabled = true; $slots.innerHTML = '';
    $view.querySelectorAll('.cal .day').forEach(o => { if (!o.disabled) o.setAttribute('aria-pressed', 'false'); });
  };
  showMonths();
  document.getElementById('attend')?.addEventListener('change', () => { if (pickedDate) loadSlots(pickedDate); });

  book.onclick = () => {
    const attendId = document.getElementById('attend')?.value || r.studentId;
    const who = S.students.find(s => s.id === attendId);

    if ((!S.admin || S.preview) && !chosen.past && S.students.length > 1 && S.openCount > 1 && chosen.free === 1) extra += '\nこの時間の空きは残り1枠です。お一人分のみのお取り置きとなります。';
    confirmSheet(chosen.past ? '振替を記録します' : 'この日時に振り替えます', `${label}${extra ? '\n' + extra : ''}`, chosen.past ? '記録する' : '振り替える', async () => {

      if (res.code !== 'OK') throw new Error(res.ttCode || res.code);
      toast(chosen.past ? '振替を記録しました' : '振り替えました'); await reload();
    });
  };
}

/** 月ごとのカレンダー。allowed に含まれる日だけ押せる */
function calendarHtml({ start, end, dates }) {
  const allowed = new Set(dates);
  const todayIso = isoLocal(new Date());
  const [sy, sm] = start.split('-').map(Number), [ey, em] = end.split('-').map(Number);
  let html = '';
  for (let y = sy, m = sm; y < ey || (y === ey && m <= em); m === 12 ? (y++, m = 1) : m++) {
    const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
    let cells = '<div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div><div class="wd">水</div><div class="wd">木</div><div class="wd">金</div><div class="wd sat">土</div>';
    for (let i = 0; i < first.getDay(); i++) cells += '<button class="day blank" disabled></button>';
    for (let d = 1; d <= last.getDate(); d++) {
      const iso = isoLocal(new Date(y, m - 1, d));
      const ok = allowed.has(iso);
      cells += `<button class="day ${iso === todayIso ? 'today' : ''}" data-date="${iso}" ${ok ? 'aria-pressed="false"' : 'disabled'}>${d}</button>`;
    }
    html += `<div class="cal" data-ym="${y}-${String(m).padStart(2, '0')}"><div class="m">${y}年${m}月</div><div class="g">${cells}</div></div>`;
  }
  return html;
}
/** 2つの日付（yyyy-mm-dd）の間の年月を "yyyy-mm" の配列で返す（両端の月を含む） */
function monthsBetween(startIso, endIso) {
  const out = [];
  let [y, m] = startIso.split('-').map(Number);
  const [ey, em] = endIso.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) { out.push(`${y}-${String(m).padStart(2, '0')}`); m === 12 ? (y++, m = 1) : m++; }
  return out;
}
function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtJa(iso) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${m}/${d}(${'日月火水木金土'[dt.getDay()]})`; }

/** 管理者：日別の出欠。時限ごとに、欠席（台帳＋時間割の赤）・振替で来る人・出席予定・空きを並べる */
async function renderDayRoster(iso) {
  S.rosterDate = iso;
  enter('day', () => renderDayRoster(S.rosterDate));
  // 授業のある曜日だけを前後に送る
  const dows = new Set(Object.keys((S.admin && S.admin.slotOptions) || {}).map(d => '日月火水木金土'.indexOf(d)).filter(i => i >= 0));
  const step = dir => {
    const d = new Date(S.rosterDate + 'T00:00');
    for (let i = 0; i < 7; i++) { d.setDate(d.getDate() + dir); if (!dows.size || dows.has(d.getDay())) break; }
    return isoLocal(d);
  };
  const today = isoLocal(new Date());
  $view.innerHTML = `<div class="daynav">
      <button class="btn icon" id="dPrev" aria-label="前の授業日">‹</button>
      <label class="dpick"><span id="dLabel">${esc(fmtJa(iso))}</span><input type="date" id="dDate" value="${iso}" aria-label="日付を選ぶ"></label>
      <button class="btn icon" id="dNext" aria-label="次の授業日">›</button>
    </div>
    ${iso !== today ? `<button class="btn quiet todaybtn" id="dToday">今日に戻る</button>` : ''}
    <div id="roster"><div class="loading">読み込み中…</div></div>`;
  const go = v => { if (v) { restoring = true; try { renderDayRoster(v); } finally { restoring = false; } } };
  document.getElementById('dPrev').onclick = () => go(step(-1));
  document.getElementById('dNext').onclick = () => go(step(1));
  const dd = document.getElementById('dDate');
  dd.onchange = e => go(e.target.value);
  dd.onclick = () => { try { dd.showPicker(); } catch (e) { /* 未対応のブラウザは標準の動き */ } };
  const tb = document.getElementById('dToday'); if (tb) tb.onclick = () => go(today);

  let r;
  try { r = await api('dayRoster', { date: iso }); } catch (e) { document.getElementById('roster').innerHTML = `<div class="empty">${esc(messageFor(e.message))}</div>`; return; }
  if (S.rosterDate !== iso) return;   // 読み込み中に別の日へ移った
  const $r = document.getElementById('roster');
  if (!r.slots.length) {
    $r.innerHTML = `<div class="empty">${r.code === 'NO_SHEET' ? 'この月の時間割シートがありません' : r.code === 'NO_DATE' ? 'この日は時間割にありません（休校日・授業のない曜日）' : 'この日の授業はありません'}</div>`;
    return;
  }
  const nAbs = r.slots.reduce((a, s) => a + s.absent.length, 0), nTr = r.slots.reduce((a, s) => a + s.transfer.length, 0);
  const known = id => id && S.adminStudents.some(s => s.id === id);
  const who = (id, name) => known(id) ? `<button class="nm link-ish" data-sid="${esc(id)}">${esc(name)}</button>` : `<span class="nm">${esc(name)}</span>`;
  let html = `<p class="daysum">欠席 <b>${nAbs}</b>名・振替 <b>${nTr}</b>名</p>`;
  html += r.slots.map(s => {
    const pills = [
      s.absent.length ? `<span class="pill abs">欠席 ${s.absent.length}</span>` : '',
      s.transfer.length ? `<span class="pill tr">振替 ${s.transfer.length}</span>` : '',
      s.free == null ? '' : `<span class="pill">空き ${s.free}${s.gray ? `＋臨時${s.gray}` : ''}</span>`,
    ].join('');
    const rows = [];
    s.absent.forEach(a => rows.push(`<li class="abs"><span class="k">欠席</span>${who(a.id, a.name)}<span class="meta">${a.manual ? '台帳になし（時間割の赤のみ）' : a.status === '振替済' ? `振替済 → ${esc(a.to)}` : '振替待ち'}</span></li>`));
    s.transfer.forEach(t => rows.push(`<li class="tr"><span class="k">振替</span>${who(t.id, t.name)}<span class="meta">${t.forName ? `${esc(t.forName)}さんの分・` : ''}${esc(t.from)}の欠席${t.note ? '・メモに記録' : ''}</span></li>`));
    return `<section class="rslot"><div class="rh"><b>${esc(s.label)}</b><span class="pills">${pills}</span></div>
      ${rows.length ? `<ul class="rl">${rows.join('')}</ul>` : ''}
      <div class="pres">${s.present.length ? `出席予定 ${s.present.length}名：${s.present.map(esc).join('、')}` : s.free == null ? '時間割に列がありません' : '出席予定なし'}</div></section>`;
  }).join('');
  html += `<p class="curnote">時間割から名前を消しただけで台帳に登録していない欠席は表示されません。</p>`;
  $r.innerHTML = html;
  $r.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => renderAdminStudent(b.dataset.sid));
}

function renderAdminPicker(next) {
  enter('picker', () => renderAdminPicker(next));
  const order = ['火', '水', '木', '金', '土', '日'];
  const rooms = (S.admin && S.admin.dayRooms) || {};
  const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  // 曜日ごとに、生徒をいちばん早いコマの時刻で並べる（2コマの生徒は1行にまとめる）
  const byDow = {};
  order.forEach(d => { byDow[d] = []; });
  S.adminStudents.forEach(s => {
    const per = {};
    (s.slots || []).forEach(sl => { (per[sl.dow] = per[sl.dow] || []).push(sl.time); });
    Object.keys(per).forEach(d => { if (byDow[d]) byDow[d].push({ s, times: per[d].sort((a, b) => mins(a) - mins(b)) }); });
  });
  order.forEach(d => byDow[d].sort((a, b) => mins(a.times[0]) - mins(b.times[0]) || a.s.name.localeCompare(b.s.name, 'ja')));
  const days = order.filter(d => byDow[d].length);
  const todayDow = '日月火水木金土'[new Date().getDay()];
  if (!days.includes(S.pickerDow)) S.pickerDow = days.includes(todayDow) ? todayDow : days[0];

  let html = `<h2>生徒を選ぶ</h2>

      const hit = S.adminStudents.filter(s => s.name.includes(kw));

        ? hit.map(s => row(s, (s.slots || []).map(x => `${x.dow} ${x.time}`).join('、'))).join('')
        : `<div class="empty">該当する生徒がいません</div>`;
    } else {

      ).join('') || `<div class="empty">この曜日の生徒はいません</div>`;

  };

  document.getElementById('q').oninput = draw;

}

async function renderAdminStudent(studentId) {
  enter('adminStudent', () => renderAdminStudent(studentId)); busy('読み込み中…');
  const st = S.adminStudents.find(s => s.id === studentId) || { name: '' };
  try {
    prefetchCandidates(studentId);   // 台帳と同時に、欠席の候補日も取りに行く
    const ledger = await api('ledgerOf', { studentId });
    // 子画面の共通処理が参照する。同じ家庭の兄弟も入れておき、振替画面で「出席する人」を選べるようにする
    const fam = st.familyId ? S.adminStudents.filter(x => x.familyId === st.familyId && x.id !== studentId) : [];
    S.students = [{ id: studentId, name: st.name }, ...fam.map(x => ({ id: x.id, name: x.name }))];
    S.ledger = ledger; S.cur = studentId; S.openCount = ledger.filter(r => r.status === '未振替').length;
    const open = ledger.filter(r => r.status === '未振替').sort((a, b) => a.date.localeCompare(b.date));
    const done = ledger.filter(r => r.status === '振替済').sort((a, b) => b.transferDate.localeCompare(a.transferDate));
    let html = `<div class="adm">${esc(st.name)}さんの台帳（保護者へのLINE通知は送られません）</div>`;
    const slotText = (st.slots || []).map(x => `${x.dow} ${x.time}${x.from ? `（${x.from}から）` : ''}`).join('、') || '未登録';
    html += `<div class="group">${(st.slots || []).length ? `<button class="cell" id="goMove"><span class="ct"><b>通常のコマ</b><small>${esc(slotText)}</small></span><span class="cv">移動</span><i class="chev"></i></button>` : `<div class="cell static"><span class="ct"><b>通常のコマ</b><small>${esc(slotText)}</small></span></div>`}`;
    html += st.leaving ? `<div class="cell static"><span class="ct"><b>${esc(st.leaving)}で退会予定</b></span></div></div>` : `<button class="cell" id="goLeave"><span class="ct"><b>退会の手続き</b></span><i class="chev"></i></button></div>`;
    html += `<h2><span>振替待ち</span>${open.length ? `<span>${open.length}件</span>` : ''}</h2>`;
    html += `<div class="list">${open.length ? open.map(r => ticket(r)).join('') : `<div class="empty">振替待ちはありません</div>`}</div>`;
    if (done.length) html += `<h2><span>振替済み</span></h2><div class="list">${done.slice(0, 10).map(r => ticket(r)).join('')}</div>`;
    html += `<div class="dock"><button class="btn primary" id="goAbs">この生徒の欠席を登録</button></div>`;
    $view.innerHTML = html;
    document.getElementById('goAbs').onclick = () => renderAbsence();
    const gm = document.getElementById('goMove'); if (gm) gm.onclick = () => renderMoveSlot(studentId);
    const gl = document.getElementById('goLeave'); if (gl) gl.onclick = () => renderWithdraw(studentId);
    $view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => onTicketAction(b.dataset.act, b.dataset.id));
  } catch (e) { fail(e); renderAdminHome(); }
}

// ---------- 通常のコマを移動（管理者） ----------
function renderMoveSlot(studentId) {
  enter('move', () => renderMoveSlot(studentId));
  const st = S.adminStudents.find(s => s.id === studentId) || { name: '', slots: [] };
  const opts = (S.admin && S.admin.slotOptions) || {};
  const today = isoLocal(new Date());
  let html = `<div class="adm">${esc(st.name)}さんのコマ移動</div>`;
  html += `<label class="f" for="mvFrom">移動するコマ</label><select id="mvFrom">${(st.slots || []).map(x => `<option value="${esc(x.dow)}|${esc(x.time)}">${esc(x.dow)} ${esc(x.time)}</option>`).join('')}</select>`;
  html += `<label class="f" for="mvDow">移動先の曜日</label><select id="mvDow">${Object.keys(opts).map(d => `<option>${esc(d)}</option>`).join('')}</select>`;
  html += `<label class="f" for="mvTime">移動先の時刻</label><select id="mvTime"></select>`;
  html += `<label class="f" for="mvEff">変更日（この日以降の授業から移動）</label><input type="date" id="mvEff" min="${today}" value="${today}">`;
  html += `<div id="mvPlan" style="margin-top:16px"></div>`;
  html += `<div class="dock"><button class="btn primary" id="mvGo">確認する</button></div>`;
  $view.innerHTML = html;

  const $dow = document.getElementById('mvDow'), $time = document.getElementById('mvTime'), $plan = document.getElementById('mvPlan'), $go = document.getElementById('mvGo');
  const fillTimes = () => { $time.innerHTML = (opts[$dow.value] || []).map(t => `<option>${esc(t)}</option>`).join(''); };
  fillTimes();
  let planned = null;
  const params = () => { const [fromDow, fromTime] = document.getElementById('mvFrom').value.split('|'); return { studentId, fromDow, fromTime, toDow: $dow.value, toTime: $time.value, effective: document.getElementById('mvEff').value }; };
  const reset = () => { planned = null; $plan.innerHTML = ''; $go.textContent = '確認する'; $go.disabled = false; };
  ['mvFrom', 'mvDow', 'mvTime', 'mvEff'].forEach(id => document.getElementById(id).addEventListener('change', () => { if (id === 'mvDow') fillTimes(); reset(); }));

  $go.onclick = async () => {
    if (planned) {
      const p = planned;
      return confirmSheet('通常のコマを移動します', `${st.name}さん：${p.from} → ${p.to}\n${p.effective}以降の時間割 ${p.cellCount}か所と通常枠を書き換えます。`, '移動する', async () => {
        const r = await api('applyMove', params());
        if (r.code !== 'OK') { planned = null; showPlan(r.plan); throw new Error('移動できませんでした。内容を確認してください'); }
        toast('通常のコマを移動しました');
        S.admin = await api('home'); S.adminStudents = S.admin.students || [];
        goBack();
      });
    }
    $go.disabled = true; $plan.innerHTML = `<div class="loading">時間割を確認しています…</div>`;
    try { showPlan(await api('planMove', params())); } catch (e) { $plan.innerHTML = `<div class="empty">${esc(messageFor(e.message))}</div>`; $go.disabled = false; }
  };

  function showPlan(p) {
    let h = `<h2>確認結果</h2><p class="lead">${esc(p.from)} → ${esc(p.to)}（${esc(p.effective)}から）／時間割 ${p.cellCount}か所${p.sheets.length ? `（${esc(p.sheets.join('、'))}）` : ''}</p>`;
    h += p.blockers.map(b => `<div class="issue" style="border-left-color:var(--danger);background:#fbeceb"><b>止める理由</b>：${esc(b)}</div>`).join('');
    h += p.warnings.map(w => `<div class="issue"><b>注意</b>：${esc(w)}</div>`).join('');
    if (p.ok && p.newWeeks.length) h += `<p class="lead" style="margin-top:10px">移動先に書き込む授業：${esc(p.newWeeks.join('、'))}</p>`;
    $plan.innerHTML = h;
    planned = p.ok ? p : null;
    $go.disabled = !p.ok;
    $go.textContent = p.ok ? 'この内容で移動する' : '止める理由を解消してください';
  }
}

const lessonCode = (it, i) => it.single ? `${it.stage}` : `${it.stage}-${i + 1}`;

// ---------- 文言の上書き（スプレッドシート「カリキュラム文言」で先生が編集） ----------
// 1行 = [種類, キー, 名前, 学習内容, 説明]。名前・番号・並び順はアプリ側で固定し、説明などの文言だけを差し替える
/** 今の内容を、編集用シートに書き出す形にする */
function curTextRows() {
  const rows = [];
  CURRICULUM.forEach(c => c.cats.forEach(k => {
    rows.push(['目標', k.name, '', '', k.goal || '']);
    rows.push(['目安', k.name, '', '', k.pace || '']);
    (k.words || []).forEach(w => rows.push(['用語', k.name, w[0], '', w[1]]));
    k.items.forEach(it => {
      if (it.stage) it.lessons.forEach((l, i) => rows.push(['授業', lessonCode(it, i), l[0], l[1] || '', l[2] || '']));
      else if (it.block) {
        rows.push(['まとまり', it.block, it.block, '', it.desc || '']);
        (it.subs || []).forEach(sb => rows.push(['小項目', `${it.block}／${sb[0]}`, sb[0], '', sb[1] || '']));
      } else if (it.review) rows.push(['復習用', it.review, it.review, '', it.desc || '']);
    });
  }));
  return rows;
}
/** シートの文言を反映する。変わったところがあれば true */
function applyCurText(rows) {
  if (!Array.isArray(rows) || !rows.length) return false;
  const T = v => String(v == null ? '' : v).trim();
  const map = {}, words = {};
  rows.forEach(r => {
    const [kind, key, name, sheet, desc] = r.map(T);
    if (!kind || !key) return;
    if (kind === '用語') { if (name) (words[key] = words[key] || []).push([name, desc]); return; }   // 用語は行の追加・削除もできる
    map[`${kind}|${key}`] = { sheet, desc };
  });
  let changed = false;
  const set = (obj, prop, v) => { if (v && obj[prop] !== v) { obj[prop] = v; changed = true; } };   // 空欄はアプリの既定の文言のまま
  CURRICULUM.forEach(c => c.cats.forEach(k => {
    set(k, 'goal', (map['目標|' + k.name] || {}).desc);
    set(k, 'pace', (map['目安|' + k.name] || {}).desc);
    if (words[k.name] && JSON.stringify(words[k.name]) !== JSON.stringify(k.words)) { k.words = words[k.name]; changed = true; }
    k.items.forEach(it => {
      if (it.stage) it.lessons.forEach((l, i) => {
        const o = map['授業|' + lessonCode(it, i)]; if (!o) return;
        if (l[1] !== o.sheet) { l[1] = o.sheet; changed = true; }   // 学習内容は空欄にすると表示しない
        if (o.desc && l[2] !== o.desc) { l[2] = o.desc; changed = true; }
      });
      else if (it.block) {
        set(it, 'desc', (map['まとまり|' + it.block] || {}).desc);
        (it.subs || []).forEach(sb => { const o = map[`小項目|${it.block}／${sb[0]}`]; if (o && o.desc && sb[1] !== o.desc) { sb[1] = o.desc; changed = true; } });
      } else if (it.review) set(it, 'desc', (map['復習用|' + it.review] || {}).desc);
    });
  }));
  if (changed) S._cur = null;   // 検索用の一覧を作り直す
  return changed;
}
/** 文言を読み込む。前回の内容は端末に覚えておき、すぐに表示してから最新に差し替える */
let CUR_TEXT = 'none';   // none / loading / done
function loadCurText(onChange) {
  if (CUR_TEXT !== 'none') return;
  try { const saved = JSON.parse(localStorage.getItem('curText') || 'null'); if (saved) applyCurText(saved); } catch (e) { /* 端末に保存できない環境でも動く */ }
  if (MOCK) { CUR_TEXT = 'done'; return; }
  CUR_TEXT = 'loading';
  api('curriculumText').then(rows => {
    CUR_TEXT = 'done';
    try { localStorage.setItem('curText', JSON.stringify(rows || [])); } catch (e) { /* 同上 */ }
    if (applyCurText(rows)) onChange();
  }).catch(() => { CUR_TEXT = 'none'; });   // 読めなかったときはアプリの既定の文言で表示し、次に開いたときに再挑戦
}
/** 管理者：編集用シートを作る（既にあるときは上書きの確認をする） */
async function exportCurText(overwrite) {
  busy('読み込み中…');
  try {
    const r = await api('curriculumExport', { rows: curTextRows(), overwrite: !!overwrite });
    if (r.code === 'EXISTS') {
      renderCurriculum();
      return confirmSheet('編集用シートは既にあります', '今アプリに表示されている内容でシートを作り直します。シートで編集済みの文言は、反映済みであればそのまま残ります。', '作り直す', () => exportCurText(true));
    }
    toast(`スプレッドシートに「${r.sheet}」を作りました（${r.rows}行）`);
  } catch (e) { fail(e); }
  renderCurriculum();
}
/** カリキュラムを、探しやすい一覧にする（ステージの回・検定などのまとまり・その中の小項目・復習用） */
function curItems() {
  if (S._cur) return S._cur;
  const list = [], stages = {};
  CURRICULUM.forEach(c => c.cats.forEach(k => {
    const nums = k.items.filter(i => i.stage).map(i => i.stage);
    const range = `${Math.min(...nums)}〜${Math.max(...nums)}`;
    let last = 0;
    k.items.forEach(it => {
      const base = { chapter: c.chapter, cat: k.name, after: last, range };
      if (it.stage) {
        last = it.stage;
        stages[it.stage] = { title: it.title, chapter: c.chapter, cat: k.name, count: it.lessons.length };
        it.lessons.forEach((l, i) => list.push({ kind: 'lesson', stage: it.stage, idx: i, code: lessonCode(it, i), title: l[0], sheet: l[1], desc: l[2], chapter: c.chapter, cat: k.name }));
      } else if (it.block) {
        it._id = 'b' + list.length;
        list.push({ ...base, kind: 'block', id: it._id, title: it.block, desc: it.desc });
        (it.subs || []).forEach((sub, i) => { const id = `${it._id}s${i}`; list.push({ ...base, kind: 'sub', id, parent: it.block, parentId: it._id, n: i + 1, title: sub[0], desc: sub[1] }); });
      } else if (it.review) {
        it._id = 'r' + list.length;
        list.push({ ...base, kind: 'review', id: it._id, title: it.review, desc: it.desc });
      }
    });
  }));
  return (S._cur = { list, stages });
}
/** 授業報告の表記（8-3、【ステージ8-3】）、ステージ番号（8）、言葉（検定・ドリルなど）で探す */
function curSearch(q) {
  const { list, stages } = curItems();
  const norm = x => String(x || '').normalize('NFKC').toLowerCase().replace(/\s+/g, '');
  const n = norm(q).replace(/(\d)[ー−‐–—―-](?=\d)/g, '$1-');   // 数字にはさまれた横棒だけを区切りとみなす
  if (!n) return [];
  let m = n.match(/(\d{1,2})-(\d{1,2})/);
  if (m) {
    const exact = list.find(x => x.kind === 'lesson' && x.code === `${+m[1]}-${+m[2]}`);
    const single = list.find(x => x.kind === 'lesson' && x.stage === +m[1] && x.idx === +m[2] - 1);
    return [exact || single].filter(Boolean);
  }
  m = n.match(/^【?(?:ステージ|stage)?(\d{1,2})】?$/);
  if (m) return stages[+m[1]] ? [{ kind: 'stage', stage: +m[1], ...stages[+m[1]] }] : [];
  const key = n.replace(/[【】]/g, '');
  const stageHits = Object.keys(stages).filter(k => norm(stages[k].title).includes(key)).map(k => ({ kind: 'stage', stage: +k, ...stages[k] }));
  const hitStages = new Set(stageHits.map(h => h.stage));
  const itemHits = list.filter(x => norm(x.title).replace(/[【】]/g, '').includes(key) && !(x.kind === 'lesson' && hitStages.has(x.stage)));
  // まとまり（ミニゲームなど）と、その中の小項目が両方当たったら、小項目を優先して出す
  const subParents = new Set(itemHits.filter(x => x.kind === 'sub').map(x => x.parentId));
  return stageHits.concat(itemHits.filter(x => !(x.kind === 'block' && subParents.has(x.id) && itemHits.filter(y => y.parentId === x.id).length === 1))).slice(0, 10);
}
function curLabel(h) {
  if (h.kind === 'lesson') return `${h.code}　${h.title}`;
  if (h.kind === 'stage') return `ステージ${h.stage}　${h.title}`;
  if (h.kind === 'review') return `${h.title}（復習用）`;
  if (h.kind === 'sub') return `${h.title}（ステージ${h.after}のあと）`;   // ステージ23「ミニゲーム２：…」と見分けられるように
  return h.title;
}

/** 30ステージの進み具合の帯。n より前を塗り、stageKind なら n を「いまここ」、そうでなければ n まで塗る */
function curBarHtml(n, stageKind) {
  return `<div class="curbar" aria-hidden="true">${[...Array(30).keys()].map(i => i + 1).map(k => `<i class="${k < n || (!stageKind && k === n) ? 'on' : k === n ? 'here' : ''}${k === 16 ? ' gap' : ''}"></i>`).join('')}</div>`;
}

/** 一覧の並び（ステージ・まとまり・復習用）を、詳細画面のキーと前後の移動に使う形で返す */
function curIndex() {
  curItems();   // まとまり・復習用に _id を付けておく
  const out = [];
  CURRICULUM.forEach((c, ci) => c.cats.forEach((k, ki) => {
    let last = 0;
    k.items.forEach(it => {
      if (it.stage) last = it.stage;
      const key = it.stage ? 'stg' + it.stage : it._id;
      out.push({ key, it, chapter: c.chapter, ci, cat: k, ki, after: it.stage ? 0 : last });
    });
  }));
  return out;
}
/** 検索の当たりを、開く詳細画面と強調する項目に変える */
function curTarget(h) {
  if (h.kind === 'lesson') return { key: 'stg' + h.stage, mark: 'les-' + h.code };
  if (h.kind === 'stage') return { key: 'stg' + h.stage, mark: '' };
  if (h.kind === 'sub') return { key: h.parentId, mark: h.id };
  return { key: h.id, mark: '' };
}

/** カリキュラム一覧（1画面目）：検索、章の切り替え、カテゴリごとのステージの一覧 */
function renderCurriculum() {
  enter('curriculum', renderCurriculum);
  loadCurText(() => { if (CURRENT && /^cur/.test(CURRENT.name)) { restoring = true; try { CURRENT.redraw(); } finally { restoring = false; } } });
  const chapIdx = S.curChap || 0;
  let html = S.admin && !S.preview
    ? `<div class="adm">文言はスプレッドシートの「カリキュラム文言」シートで編集できます。<button class="btn small" id="curExport">編集用シートを作る</button></div>`
    : '';
  html += `<form class="searchbar" id="curF" role="search"><input id="curQ" type="search" value="${esc(S.curQ || '')}" placeholder="授業報告の番号や言葉（例：8-3、検定）" enterkeyhint="search" autocomplete="off" aria-label="カリキュラムを探す"><button class="btn primary" type="submit">探す</button></form>`;
  if (S.curHits && S.curHits.length > 1) {
    html += `<h2><span>${S.curHits.length}件見つかりました</span></h2><div class="group">${S.curHits.map((h, i) => `<button class="cell" data-hit="${i}"><span class="ct"><b>${esc(curLabel(h))}</b></span><i class="chev"></i></button>`).join('')}</div>`;
  } else if (S.curHits && !S.curHits.length) {
    html += `<div class="empty">見つかりませんでした。「8-3」のような番号か、「検定」「ドリル」などの言葉で探してください。</div>`;
  }
  html += `<div class="seg" role="tablist">${CURRICULUM.map((c, i) => `<button role="tab" aria-selected="${i === chapIdx}" data-chap="${i}">${esc(c.chapter)}<small>ステージ${i ? '16〜30' : '1〜15'}</small></button>`).join('')}</div>`;
  CURRICULUM[chapIdx].cats.forEach((k, ki) => {
    html += `<h2 class="cathead"><span>${esc(k.name)}</span></h2>`;
    if (k.goal || k.pace) html += `<p class="catmeta">${k.goal ? esc(k.goal) : ''}${k.goal && k.pace ? '<br>' : ''}${k.pace ? `目安：${esc(k.pace)}` : ''}</p>`;
    html += `<div class="group">`;
    k.items.forEach(it => {
      if (it.stage) {
        html += `<button class="cell" data-key="stg${it.stage}"><span class="badge">${it.stage}</span><span class="ct"><b>${esc(it.title)}</b>${it.unit ? `<small>${esc(it.unit)}</small>` : ''}</span><i class="chev"></i></button>`;
      } else if (it.block) {
        html += `<button class="cell" data-key="${it._id}"><span class="badge alt" aria-hidden="true">★</span><span class="ct"><b>${esc(it.block)}</b>${it.note ? `<small>${esc(it.note)}</small>` : ''}</span><i class="chev"></i></button>`;
      } else if (it.review) {
        html += `<button class="cell minor" data-key="${it._id}"><span class="badge ghost">復習</span><span class="ct">${esc(it.review)}</span><i class="chev"></i></button>`;
      }
    });
    if (k.words && k.words.length) html += `<button class="cell minor" data-gloss="${chapIdx}-${ki}"><span class="badge ghost">用語</span><span class="ct">このカテゴリで出てくる言葉</span><i class="chev"></i></button>`;
    html += `</div>`;
  });
  html += `<p class="curnote">カリキュラムは改定や順序が変更される場合があります。各回の説明は、保護者の方向けに内容をかみくだいたものです。</p>`;
  $view.innerHTML = html;

  const rerender = () => { restoring = true; try { renderCurriculum(); } finally { restoring = false; } };
  document.getElementById('curF').onsubmit = e => {
    e.preventDefault();
    const q = document.getElementById('curQ').value; S.curQ = q;
    const hits = curSearch(q);
    if (hits.length === 1) { S.curHits = null; const t = curTarget(hits[0]); return renderCurDetail(t.key, t.mark); }
    S.curHits = q.trim() ? hits : null; rerender();
  };
  const ex = document.getElementById('curExport'); if (ex) ex.onclick = () => exportCurText(false);
  $view.querySelectorAll('[data-hit]').forEach(b => b.onclick = () => { const t = curTarget(S.curHits[+b.dataset.hit]); renderCurDetail(t.key, t.mark); });
  $view.querySelectorAll('[data-chap]').forEach(b => b.onclick = () => { S.curChap = +b.dataset.chap; rerender(); });
  $view.querySelectorAll('[data-key]').forEach(b => b.onclick = () => renderCurDetail(b.dataset.key, ''));
  $view.querySelectorAll('[data-gloss]').forEach(b => b.onclick = () => renderCurGloss(b.dataset.gloss));
}

/** カリキュラムの詳細（2画面目）：ステージなら全回の説明を、開け閉めなしで並べる。mark は強調して見せる項目の id */
function renderCurDetail(key, mark) {
  enter('curDetail', () => renderCurDetail(key, mark));
  const idx = curIndex();
  const pos = idx.findIndex(x => x.key === key);
  if (pos < 0) return renderCurriculum();
  const e = idx[pos], it = e.it;
  S.curChap = e.ci;
  const stTitle = n => { const f = idx.find(x => x.key === 'stg' + n); return f ? f.it.title : ''; };
  let html = `<p class="eyebrow">${esc(e.chapter)}・${esc(e.cat.name)}</p>`;
  if (it.stage) {
    html += `<h1 class="ptitle"><span class="no">ステージ${it.stage}</span>${esc(it.title)}</h1>${it.unit ? `<p class="psub">${esc(it.unit)}</p>` : ''}`;
    html += `<div class="progress"><div class="s">全30ステージのうち ${it.stage}番目</div>${curBarHtml(it.stage, true)}</div>`;
    html += `<ol class="lessons">${it.lessons.map((l, i) => {
      const code = lessonCode(it, i);
      const head = l[0] && l[0] !== it.title ? l[0] : (l[1] || l[0]);
      const sheet = l[1] && l[1] !== head ? l[1] : '';
      return `<li class="lesson${mark === 'les-' + code ? ' here' : ''}" id="les-${code}"><div class="lh"><span class="code">${code}</span><b>${esc(head)}</b></div>${sheet ? `<div class="sh">${esc(sheet)}</div>` : ''}<p>${esc(l[2])}</p></li>`;
    }).join('')}</ol>`;
  } else {
    const title = it.block || it.review;
    html += `<h1 class="ptitle">${esc(title)}</h1>`;
    if (it.review) html += `<p class="psub">復習用のステージ</p>`;
    if (e.after) html += `<div class="progress"><div class="s">ステージ${e.after}「${esc(stTitle(e.after))}」のあとに取り組みます</div>${curBarHtml(e.after, false)}</div>`;
    if (it.desc) html += `<p class="pdesc">${esc(it.desc)}</p>`;
    if (it.subs && it.subs.length) {
      html += `<ol class="lessons">${it.subs.map((sb, i) => `<li class="lesson${mark === `${it._id}s${i}` ? ' here' : ''}" id="${it._id}s${i}"><div class="lh"><span class="code">${i + 1}</span><b>${esc(sb[0])}</b></div><p>${esc(sb[1])}</p></li>`).join('')}</ol>`;
    }
  }
  // 前後の項目へ（同じ画面のまま差し替える）
  const prev = idx[pos - 1], next = idx[pos + 1];
  const navLabel = x => x.it.stage ? `ステージ${x.it.stage}` : (x.it.block || x.it.review);
  html += `<nav class="pager">${prev ? `<button class="btn" data-go="${prev.key}">‹ ${esc(navLabel(prev))}</button>` : '<span></span>'}${next ? `<button class="btn" data-go="${next.key}">${esc(navLabel(next))} ›</button>` : '<span></span>'}</nav>`;
  $view.innerHTML = html;
  $view.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    restoring = true;   // 履歴を積まずに差し替える（戻るで一覧に戻れるように）
    try { renderCurDetail(b.dataset.go, ''); } finally { restoring = false; }
    window.scrollTo(0, 0);
  });
  const el = mark && document.getElementById(mark);
  if (el) el.scrollIntoView({ block: 'center' }); else window.scrollTo(0, 0);
}

/** カテゴリの用語（2画面目） */
function renderCurGloss(ref) {
  enter('curGloss', () => renderCurGloss(ref));
  const [ci, ki] = ref.split('-').map(Number);
  const c = CURRICULUM[ci], k = c && c.cats[ki];
  if (!k) return renderCurriculum();
  $view.innerHTML = `<p class="eyebrow">${esc(c.chapter)}・${esc(k.name)}</p><h1 class="ptitle">このカテゴリで出てくる言葉</h1>
    <dl class="gloss">${(k.words || []).map(w => `<div><dt>${esc(w[0])}</dt><dd>${esc(w[1])}</dd></div>`).join('')}</dl>`;
  window.scrollTo(0, 0);
}

/** 確認結果（止める理由・注意）を描く。ok なら true を返す */
function drawPlan($el, p, lead) {
  let h = `<h2>確認結果</h2><p class="lead">${lead}</p>`;
  h += p.blockers.map(b => `<div class="issue" style="background:#fbecea;color:#9b2c22"><b>止める理由</b>：${esc(b)}</div>`).join('');
  h += p.warnings.map(w => `<div class="issue"><b>注意</b>：${esc(w)}</div>`).join('');
  $el.innerHTML = h;
  return p.ok;
}

// ---------- 確認パネル ----------
function confirmSheet(title, text, okLabel, onOk, opts = {}) {
  if (S.preview) { okLabel = 'プレビューのため送信できません'; onOk = null; }
  else if (S.admin) text += '\n（保護者へのLINE通知は送られません）';
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p style="white-space:pre-line">${esc(text)}</p>
    <button class="btn primary${opts.cancel && onOk ? ' cancel' : ''}" id="ok">${esc(okLabel)}</button><button class="btn" id="ng">戻る</button></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('#ng').onclick = close;
  el.onclick = e => { if (e.target === el) close(); };
  if (!onOk) el.querySelector('#ok').disabled = true;
  el.querySelector('#ok').onclick = async () => {
    if (!onOk) return;
    const b = el.querySelector('#ok'); b.disabled = true; b.textContent = '送信中…';
    try { await onOk(); close(); } catch (e) {
      close();
      if (!String(e.message).startsWith('UNCERTAIN:')) return fail(e);
      // 結果が分からないときは最新の状態を読み込み直し、画面の上に確認のお願いを出す
      console.error(e);
      try { await reload(); } catch (e2) { /* 読み込みに失敗した場合はそちらのメッセージが出る */ }
      const note = document.createElement('div'); note.className = 'adm';
      note.textContent = messageFor(e.message);
      $view.prepend(note);
    }
  };
}
