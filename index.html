<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>欠席・振替</title>
<script>window.__MOCK__ = false; window.__MOCK_ADMIN__ = false; /* GAS の doGet が ?mock=1 / ?admin=1 のとき true に書き換える */</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light">
<style>
  /* ===== トークン：白と墨を基調に、操作できる場所だけ青。フォントは Zen Kaku Gothic New に統一 ===== */
  :root{
    /* 案3「木と青緑」：白地に木の色味の面、押せる場所は青緑。フォントは Zen Kaku Gothic New に統一 */
    --bg:#ffffff; --head:rgba(251,247,242,.94); --panel:#f4ebdf; --panel-sub:#6e6257; --panel-line:#e3d6c6; --muted:#f8f4ef;
    --ink:#2b2622; --sub:#766a5f; --faint:#b3a89c; --line:#ece4da;
    --accent:#1d6b67; --accent-ink:#ffffff; --accent-tint:#e6f2f1; --accent-off:#b7d1cf;
    --open-bg:#f8e3cc; --open-fg:#8a4d10; --done-bg:#d9eeec; --done-fg:#1d6b67;
    --danger:#b42318; --cancel:#b5524a; --cancel-line:#e8c0ba; --notice:#8a4d10; --notice-tint:#fbf0e3;
    --r:12px; --r-s:8px;
    color-scheme:light;
  }
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.6 "Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
    font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  .num,.ticket .date,.next .first,.cal .day,.slot .tm,.row .d,.row .t{font-feature-settings:"tnum" 1}
  #app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  /* ヘッダー */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);backdrop-filter:saturate(1.4) blur(8px);
    display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);min-height:52px}
  header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
  header .who{margin-left:auto;font-size:13px;color:var(--sub)}
  header .back{border:0;background:none;padding:6px 8px 6px 0;margin-left:-2px;font-size:15px;font-weight:500;color:var(--accent);cursor:pointer}
  header .back[hidden]+h1{margin-left:0}
  main{padding:20px 20px 112px;flex:1}

  h2{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:32px 0 10px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.04em}
  h2:first-child{margin-top:4px}
  p.lead{margin:0 0 16px;color:var(--sub);font-size:14px}

  /* きょうだいの切り替え：下線のタブ */
  .tabs{display:flex;gap:20px;margin:-4px 0 20px;border-bottom:1px solid var(--line)}
  .tab{border:0;background:none;padding:8px 0 10px;font-size:15px;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}

  /* 次の授業 */
  .next{background:var(--panel);border-radius:var(--r);padding:16px 18px}
  .next .first{font-size:26px;font-weight:700;line-height:1.3;letter-spacing:.01em}
  .next .rest{margin-top:10px;padding-top:10px;border-top:1px solid var(--panel-line);display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--panel-sub)}
  .next .tag{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid currentColor;border-radius:999px;font-size:11px;font-weight:700;vertical-align:3px;color:var(--accent)}
  .next .rest .tag{vertical-align:1px}

  /* 欠席の行（カードではなく区切り線の一覧） */
  .list{border-top:1px solid var(--line)}
  .ticket{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .ticket .body{flex:1;min-width:0}
  .ticket .date{font-size:17px;font-weight:700;line-height:1.35}
  .ticket .sub{font-size:13px;color:var(--sub);margin-top:2px}
  .ticket .sub b{color:var(--ink);font-weight:700}
  .ticket .sub .arrow{margin-right:4px;color:var(--sub)}
  .ticket .acts{flex:none}
  .chip{display:inline-block;margin-right:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:1px}
  .chip.open{background:var(--open-bg);color:var(--open-fg)}
  .chip.done{background:var(--done-bg);color:var(--done-fg)}
  .link{border:0;background:none;padding:6px 0 0;font-size:13px;color:var(--cancel);text-decoration:underline;text-decoration-color:var(--cancel-line);text-underline-offset:3px;cursor:pointer}
  .link.danger{color:var(--danger)}

  /* ボタン */
  .btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-s);padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;line-height:1.3}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:disabled{background:var(--accent-off);border-color:var(--accent-off);color:#fff}
  .btn.quiet{border-color:transparent;background:none;color:var(--sub);font-weight:500;padding:6px 8px}
  .btn.danger{color:var(--danger)}
  .btn:focus-visible,.tab:focus-visible,.link:focus-visible,.back:focus-visible,.day:focus-visible,.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .empty{padding:20px 0;color:var(--sub);font-size:14px;border-bottom:1px solid var(--line)}
  .loading{padding:40px 0;text-align:center;color:var(--sub);font-size:14px}

  /* 画面下の主ボタン */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
    padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,rgba(255,255,255,0))}
  .dock .btn{width:100%;max-width:480px;padding:15px;font-size:16px;border-radius:var(--r);background:var(--ink);border-color:var(--ink);color:#fff}
  .dock .btn:disabled{background:#cfc6bb;border-color:#cfc6bb}

  /* 欠席する日の選択 */
  .row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .row input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:1.5px solid var(--faint);border-radius:6px;display:grid;place-items:center;background:var(--bg)}
  .row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
  .row input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
  .row .d{font-size:16px;font-weight:700;min-width:6.2em}
  .row .t{font-size:15px;color:var(--sub)}
  .row.past .d{color:var(--sub);font-weight:500}
  .row .note{margin-left:auto;font-size:12px;color:var(--sub)}
  .row.disabled{opacity:.45;cursor:default}

  label.f{display:block;margin:24px 0 8px;font-size:13px;font-weight:700;color:var(--sub)}
  textarea,input[type=date],select,.search{width:100%;border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px;background:var(--bg);font-size:15px}
  textarea{min-height:84px;resize:vertical}
  textarea:focus,select:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

  /* カレンダー */
  .legend{margin:-2px 0 12px;font-size:12px;color:var(--sub)}
  .cal{margin-bottom:20px}
  .cal .m{margin:0 0 6px;font-size:15px;font-weight:700}
  .cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal .wd{text-align:center;font-size:11px;color:var(--sub);padding:4px 0}
  .cal .wd.sun{color:var(--cancel)}.cal .wd.sat{color:var(--accent)}
  .cal .day{height:42px;border:0;border-radius:var(--r-s);background:none;font-size:15px;font-weight:700;cursor:pointer}
  .cal .day:not(:disabled):hover{background:var(--panel)}
  .cal .day:disabled{color:#cfc6bb;font-weight:400;cursor:default}
  .cal .day.today{box-shadow:inset 0 0 0 1.5px var(--faint)}
  .cal .day[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:none}
  .cal .day.blank{visibility:hidden}

  /* 時限の選択 */
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .slot{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg);text-align:left;cursor:pointer}
  .slot .tm{font-size:20px;font-weight:700;line-height:1.2}
  .slot .st{margin-top:4px;font-size:12px;color:var(--sub)}
  .slot.gray .st{color:var(--notice)}
  .slot.ng{background:var(--muted);border-color:var(--muted);color:var(--faint);cursor:default}
  .slot.ng .st{color:var(--faint)}
  .slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}

  /* 日付を選んだとき、時限の一覧を画面の上まで送れるよう余白を確保 */
  .slotarea{margin-top:8px;min-height:calc(100dvh - 180px);scroll-margin-top:68px}
  .slotarea:empty{min-height:0}
  .warn{margin-top:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--notice-tint);color:var(--notice);font-size:13px}

  /* 確認パネル */
  .sheet{position:fixed;inset:0;z-index:10;background:rgba(43,38,34,.38);display:flex;align-items:flex-end;justify-content:center}
  .sheet .card{width:100%;max-width:520px;background:var(--bg);border-radius:18px 18px 0 0;padding:24px 20px calc(16px + env(safe-area-inset-bottom,0px))}
  .sheet h3{margin:0 0 8px;font-size:18px;font-weight:700}
  .sheet .card p{margin:0 0 20px;font-size:15px;color:var(--sub)}
  .sheet .card .btn{width:100%;padding:14px;margin-top:8px;font-size:16px;border-radius:var(--r)}
  .sheet .card .btn:not(.primary){border-color:transparent;color:var(--sub)}
  .sheet .card .btn.primary.cancel{background:var(--cancel);border-color:var(--cancel)}

  #toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:20;transform:translate(-50%,8px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .mock{background:var(--notice-tint);color:var(--notice);font-size:12px;text-align:center;padding:5px}

  /* 管理者 */
  .adm{margin-bottom:20px;padding:12px 14px;border-radius:var(--r-s);background:var(--muted);font-size:13px;color:var(--sub)}
  .arow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .arow .n{font-weight:700}
  .arow .c,.arow .go{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap;font-feature-settings:"tnum" 1}
  .arow .btn{padding:7px 12px;font-size:13px}
  .arow .n + .btn{margin-left:auto}
  .arow .tm{flex:none;width:7.5em;font-weight:700;font-feature-settings:"tnum" 1}
  .arow .tm + .n + .btn{margin-left:auto}
  .pickbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .pickbar select{width:auto;min-width:8em;font-weight:700}
  .room{font-size:13px;color:var(--sub)}
  .tgroup{margin:20px 0 0;padding-bottom:6px;font-size:13px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--ink);font-feature-settings:"tnum" 1}
  .search{margin-bottom:6px}
  .issue{margin-bottom:8px;padding:10px 12px;border-radius:var(--r-s);background:var(--notice-tint);color:var(--notice);font-size:13px}
  .issue b{font-weight:700}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <div id="mockbar" class="mock" hidden>モック表示中：LINEに接続していません。データは架空です。</div>
  <header><button class="back" id="back" hidden aria-label="前の画面に戻る">‹ 戻る</button><h1>欠席・振替</h1><span class="who" id="who"></span></header>
  <main id="view"><div class="loading">読み込み中…</div></main>
</div>
<div id="toast" role="status"></div>

<script>
// =============================================================
// 設定
// =============================================================
const LIFF_ID = '2011756125-bAh93kVs';   // LINEログインチャネル > LIFF で発行される ID
const API_URL = 'https://script.google.com/macros/s/AKfycbwuH-fKM32HKDdRvK1PZDwoW413-jitvomI6Rc76W8TQwgbEpIre8ubIXc3eIRuSciA/exec';   // GAS の Web アプリ URL（外部ホスティング時に使用）
const MOCK = window.__MOCK__ === true || /[?&]mock=1/.test(location.search) || (typeof liff === 'undefined' && !window.google);

// =============================================================
// API 層（LIFF → GAS）
// =============================================================
let idToken = null;
/** 一定時間で終わらない処理をエラーにする（どこで止まったか画面に出すため） */
function withTimeout(promise, ms, label) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error(label)), ms))]);
}
async function api(action, params = {}) {
  if (MOCK) return mockApi(action, params);
  const body = { action, params, idToken };
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(s => { const r = JSON.parse(s); r.ok ? res(r.result) : rej(new Error(r.error)); })
      .withFailureHandler(e => rej(e)).apiEntry(JSON.stringify(body)));
  }
  const r = await withTimeout(fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }), 30000, `サーバーの応答がありません（${action}）`); // text/plain で送り、プリフライトを避ける
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.result;
}

// =============================================================
// 状態と描画
// =============================================================
const S = { students: [], ledger: [], nextLessons: {}, cur: null, openCount: 0, admin: null, adminStudents: [], preview: false };
const $view = document.getElementById('view');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
function busy(msg = '処理中…') { $view.innerHTML = `<div class="loading">${esc(msg)}</div>`; }
const $back = document.getElementById('back');

// ---------- 画面遷移（アプリ内で積み上げて管理。ブラウザ履歴には頼らない） ----------
const NAV = [];            // 今の画面より前の画面（{ name, redraw }）
let CURRENT = null;        // 今の画面
let restoring = false;     // 戻る操作で再描画している最中
let ignorePop = false;     // 画面上の「戻る」に伴う popstate を無視するため

/** ホーム系の画面：遷移の履歴をリセットする */
function setRoot(name, redraw) {
  NAV.length = 0;
  CURRENT = { name, redraw };
  $back.hidden = !S.preview;   // プレビュー中はホームから管理者メニューへ戻れるようにする
}
/** サブ画面に入る。同じ画面が履歴にあればそこまで巻き戻す */
function enter(name, redraw) {
  if (!restoring) {
    const idx = NAV.findIndex(n => n.name === name);
    if (idx >= 0) NAV.length = idx;
    else if (CURRENT && CURRENT.name !== name) NAV.push(CURRENT);
    try { history.pushState({ screen: name }, ''); } catch (e) {}
  }
  CURRENT = { name, redraw };
  $back.hidden = false;
}
/** 一つ前の画面に戻る */
function goBack() {
  const prev = NAV.pop();
  if (!prev) {
    if (S.preview) return exitPreview();
    return S.admin && !S.preview ? renderAdminHome() : renderHome();
  }
  restoring = true;
  try { CURRENT = prev; prev.redraw(); } finally { restoring = false; }
}
$back.onclick = () => {
  goBack();
  // 端末の戻るボタン用に積んだ履歴も一つ戻す（その popstate は無視する）
  ignorePop = true; setTimeout(() => { ignorePop = false; }, 600);
  try { history.back(); } catch (e) {}
};
window.addEventListener('popstate', () => { if (ignorePop) { ignorePop = false; return; } goBack(); });

function fail(e) { console.error(e); toast(messageFor(e.message)); }
function messageFor(code) {
  return ({
    NOT_REGISTERED: 'このLINEアカウントは教室に登録されていません。教室までご連絡ください。',
    busy: '混み合っています。少し待ってからもう一度お試しください。',
    DUPLICATE: 'その日時は既に登録されています。',
    FULL: 'その時限は満員です。別の時限を選んでください。',
    NO_SHEET: 'その月の時間割がまだ用意されていません。教室で確認して連絡します。',
    CLOSED: 'その日は休校日のため振り替えできません。',
    SLOT_CLOSED: 'その時限は現在開講していないため振り替えできません。',
  })[code] || `処理できませんでした（${code}）。教室までご連絡ください。`;
}

async function reload() {
  if (S.preview) return startPreview(S.previewStudent);
  if (S.admin) { const id = S.cur; S.admin = (await api('home')); S.adminStudents = S.admin.students || []; return id ? renderAdminStudent(id) : renderAdminHome(); }
  return loadHome();
}

async function loadHome() {
  busy('読み込み中…');
  try {
    const h = await api('home');
    if (h.admin) { S.admin = h; S.adminStudents = h.students || []; renderAdminHome(); return; }
    S.students = h.students; S.ledger = h.ledger; S.nextLessons = h.nextLessons || {}; S.openCount = h.openCount || 0;
    if (!S.cur || !S.students.some(s => s.id === S.cur)) S.cur = S.students[0]?.id || null;
    renderHome();
  } catch (e) {
    $view.innerHTML = `<div class="empty">${esc(messageFor(e.message))}</div>`;
  }
}

function renderHome() {
  setRoot('home', renderHome);
  const st = S.students.find(s => s.id === S.cur);
  document.getElementById('who').textContent = st ? `${st.name}さん${S.preview ? '（プレビュー）' : ''}` : '';
  const mine = S.ledger.filter(r => r.studentId === S.cur);
  const open = mine.filter(r => r.status === '未振替').sort((a, b) => a.date.localeCompare(b.date));
  const done = mine.filter(r => r.status === '振替済').sort((a, b) => b.transferDate.localeCompare(a.transferDate));

  let html = '';
  if (S.preview) html += `<div class="adm">プレビュー（閲覧のみ）：この家庭の保護者に見えている画面です。操作しても登録されません。左上の「戻る」で管理者メニューに戻ります。</div>`;
  if (S.students.length > 1) {
    html += `<div class="tabs" role="tablist">${S.students.map(s => `<button class="tab" role="tab" aria-selected="${s.id === S.cur}" data-id="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>`;
  }
  const nx = S.nextLessons[S.cur] || [];
  const tag = l => l.kind === 'transfer' ? `<span class="tag">振替${l.forStudentId && l.forStudentId !== S.cur ? '・' + esc(S.students.find(s => s.id === l.forStudentId)?.name || '') + 'の分' : ''}</span>` : '';
  html += `<h2>次の授業</h2>`;
  html += nx.length
    ? `<div class="next"><div class="first">${esc(nx[0].label)} ${esc(nx[0].time)}${tag(nx[0])}</div>${nx.length > 1 ? `<div class="rest">${nx.slice(1).map(l => `<span>${esc(l.label)} ${esc(l.time)}${tag(l)}</span>`).join('')}</div>` : ''}</div>`
    : `<div class="empty">予定されている授業がありません</div>`;
  html += `<h2><span>振替がまだの欠席</span>${open.length ? `<span>${open.length}件</span>` : ''}</h2>`;
  html += open.length ? `<div class="list">${open.map(r => ticket(r)).join('')}</div>` : `<div class="list"><div class="empty">振替待ちの欠席はありません</div></div>`;
  if (done.length) {
    html += `<h2><span>振替が決まっている欠席</span><span>${done.length}件</span></h2><div class="list">${done.map(r => ticket(r)).join('')}</div>`;
  }
  html += `<div class="dock"><button class="btn primary" id="goAbs">欠席を連絡する</button></div>`;
  $view.innerHTML = html;

  $view.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.cur = b.dataset.id; renderHome(); });
  document.getElementById('goAbs').onclick = () => renderAbsence();
  $view.querySelectorAll('[data-act]').forEach(b => b.onclick = () => onTicketAction(b.dataset.act, b.dataset.id));
}

function ticket(r) {
  const done = r.status === '振替済';
  const other = r.attendStudentId && r.attendStudentId !== r.studentId ? `（${esc(r.attendStudentName)}さんが出席）` : '';
  const title = done ? `${esc(r.dateLabel)} ${esc(r.time)} の欠席` : `${esc(r.dateLabel)} ${esc(r.time)}`;
  const sub = done
    ? `<span class="chip done">振替済</span><span class="arrow" aria-hidden="true">→</span><b>${esc(r.transferDateLabel)} ${esc(r.transferTime)}</b> に振替${other}`
    : `<span class="chip open">振替待ち</span>`;
  const main = done
    ? `<button class="btn" data-act="change" data-id="${esc(r.id)}">変更</button>`
    : `<button class="btn primary" data-act="transfer" data-id="${esc(r.id)}">振替を入れる</button>`;
  const second = done
    ? `<button class="link" data-act="cancelTransfer" data-id="${esc(r.id)}">振替を取り消す</button>`
    : `<button class="link" data-act="cancelAbsence" data-id="${esc(r.id)}">欠席を取り消す</button>`;
  return `<div class="ticket ${done ? 'done' : ''}"><div class="body"><div class="date">${title}</div><div class="sub">${sub}</div>${second}</div><div class="acts">${main}</div></div>`;
}

function onTicketAction(act, id) {
  const r = S.ledger.find(x => x.id === id);
  if (!r) return;
  if (act === 'transfer' || act === 'change') return renderTransfer(r);
  if (act === 'cancelTransfer') return confirmSheet('振替を取り消しますか', `${r.transferDateLabel} ${r.transferTime} の振替を取り消し、欠席は「振替待ち」に戻ります。`, '振替を取り消す', async () => {
    await api('cancelTransfer', { absenceId: id }); toast('振替を取り消しました'); await reload();
  }, { cancel: true });
  if (act === 'cancelAbsence') return confirmSheet('欠席の連絡を取り消しますか', `${r.dateLabel} ${r.time} は通常どおり出席する扱いになります。`, '欠席を取り消す', async () => {
    await api('cancelAbsence', { absenceId: id }); toast('欠席を取り消しました'); await reload();
  }, { cancel: true });
}

// ---------- 欠席連絡 ----------
async function renderAbsence() {
  enter('absence', renderAbsence);
  busy('通常の授業日を確認しています…');
  let cands;
  try { cands = await api('candidates', { studentId: S.cur }); } catch (e) { fail(e); return renderHome(); }
  const st = S.students.find(s => s.id === S.cur);
  const byDate = {};
  cands.forEach(c => (byDate[c.date] = byDate[c.date] || { label: c.label, isPast: c.isPast, items: [] }).items.push(c));
  const dates = Object.keys(byDate).sort();

  let html = `<h2>${esc(st.name)}さんの欠席する日</h2><p class="lead">通常の授業日から選んでください。複数選べます。</p>`;
  html += dates.map(d => {
    const g = byDate[d];
    return g.items.map((c, i) => {
      const dis = c.alreadyRequested;
      return `<label class="row ${g.isPast ? 'past' : ''} ${dis ? 'disabled' : ''}">
        <input type="checkbox" data-date="${esc(c.date)}" data-time="${esc(c.time)}" ${dis ? 'disabled' : ''}>
        <span class="d">${i === 0 ? esc(g.label) : ''}</span><span class="t">${esc(c.time)}</span>
        ${dis ? '<span class="note">連絡済み</span>' : (g.isPast ? '<span class="note" style="color:var(--ink-2)">過去</span>' : '')}
      </label>`;
    }).join('');
  }).join('');
  if (!dates.length) html += `<div class="empty">選べる授業日がありません。教室までご連絡ください。</div>`;
  html += `<label class="f" for="notes">教室への伝言（任意）</label><textarea id="notes" placeholder="例：発熱のため。振替は来週以降で相談したいです"></textarea>`;
  html += `<div class="dock"><button class="btn primary" id="send" disabled>欠席を連絡する</button></div>`;
  $view.innerHTML = html;

  const send = document.getElementById('send');
  const picked = () => [...$view.querySelectorAll('input[type=checkbox]:checked')].map(c => ({ date: c.dataset.date, time: c.dataset.time }));
  $view.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    // 同じ日の他のコマも一緒に選ぶ（2コマ契約の生徒向け）。外すときは個別
    if (c.checked) $view.querySelectorAll(`input[data-date="${c.dataset.date}"]:not(:disabled)`).forEach(o => o.checked = true);
    const n = picked().length; send.disabled = !n; send.textContent = n ? `${n}コマの欠席を連絡する` : '欠席を連絡する';
  });
  send.onclick = () => {
    const list = picked();
    const text = list.map(p => `${byDate[p.date].label} ${p.time}`).join('、');
    confirmSheet('この内容で連絡します', text, '欠席を連絡する', async () => {
      const notes = document.getElementById('notes').value.trim();
      let ok = 0, dup = 0;
      for (const p of list) {
        const r = await api('absence', { studentId: S.cur, date: p.date, time: p.time, notes });
        if (r.code === 'OK') ok++; else if (r.code === 'DUPLICATE') dup++; else throw new Error(r.code);
      }
      toast(dup ? `${ok}コマを連絡しました（${dup}コマは連絡済み）` : `${ok}コマの欠席を連絡しました`);
      await reload();
    });
  };
}

async function renderTransfer(r) {
  enter('transfer', () => renderTransfer(r));
  busy('振替できる日を確認しています…');
  let dates;
  try { dates = await api('transferDates'); } catch (e) { fail(e); return renderHome(); }
  const st = S.students.find(s => s.id === r.studentId);
  const siblings = S.students.filter(s => s.id !== r.studentId);
  let html = `<h2>${esc(r.dateLabel)} ${esc(r.time)} 欠席の振替先</h2>
    <p class="lead">${r.status === '振替済' ? `現在は ${esc(r.transferDateLabel)} ${esc(r.transferTime)} です。新しい日時を選ぶと差し替わります。` : '日を選ぶと、空きのある時限が表示されます。'}</p>`;
  if (siblings.length) {
    html += `<label class="f" for="attend">出席する生徒</label><select id="attend">
      <option value="${esc(r.studentId)}">${esc(st.name)}（本人）</option>${siblings.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>`;
  }
  html += `<label class="f">振替する日</label><p class="legend">薄い日は休校日・定休日・受付期間外です。</p>`;
  html += dates.dates.length ? calendarHtml(dates) : `<div class="empty">いま選べる日がありません。教室までご連絡ください。</div>`;
  html += `<div id="slots" class="slotarea"></div>`;
  html += `<div class="dock"><button class="btn primary" id="book" disabled>この日時に振り替える</button></div>`;
  $view.innerHTML = html;

  const $slots = document.getElementById('slots'), book = document.getElementById('book');
  let chosen = null, pickedDate = null;
  /** 日付を選んだら、時間の選択肢まで自動で画面を送る */
  function scrollToSlots() {
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    $slots.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
  async function loadSlots(date) {
    chosen = null; book.disabled = true; pickedDate = date;
    $slots.innerHTML = `<div class="loading">空きを確認しています…</div>`;
    scrollToSlots();
    try {
      const attendId = document.getElementById('attend')?.value || r.studentId;
      const av = await api('availability', { studentId: attendId, date });
      if (av.code !== 'OK') { $slots.innerHTML = `<div class="empty">${esc(messageFor(av.code))}</div>`; return; }
      if (!av.slots.length) { $slots.innerHTML = `<div class="empty">この日は授業がありません</div>`; return; }
      $slots.innerHTML = `<h2>${esc(fmtJa(date))} の時限</h2><div class="slots">${av.slots.map(s => {
        const cls = s.alreadyThere ? 'ng' : s.freeWhite ? 'ok' : s.freeGray ? 'gray' : 'ng';
        const txt = s.alreadyThere ? 'この時限に登録済み' : s.freeWhite ? `空き ${s.freeWhite}` : s.freeGray ? '臨時枠のみ' : '満員';
        return `<button class="slot ${cls}" data-time="${esc(s.time)}" ${cls === 'ng' ? 'disabled' : ''} aria-pressed="false"><div class="tm">${esc(s.time)}</div><div class="st">${txt}</div></button>`;
      }).join('')}</div>`;
      scrollToSlots();
      $slots.querySelectorAll('.slot').forEach(b => b.onclick = () => {
        $slots.querySelectorAll('.slot').forEach(o => o.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        const sl = av.slots.find(x => x.time === b.dataset.time) || {};
        chosen = { date, time: b.dataset.time, gray: b.classList.contains('gray'), free: (sl.freeWhite || 0) + (sl.freeGray || 0) };
        book.disabled = false;
        // 兄弟がいて、未振替が2件以上あり、残り1枠のときは注意を出す
        const old = $slots.querySelector('.warn'); if (old) old.remove();
        if ((!S.admin || S.preview) && S.students.length > 1 && S.openCount > 1 && chosen.free === 1) {
          const w = document.createElement('div'); w.className = 'warn';
          w.textContent = 'この時間の空きは残り1枠です。お一人分のみお取りできます。ごきょうだい2名分をご希望の場合は、別の時間をお選びいただくか教室にご相談ください。';
          $slots.appendChild(w);
        }
        $slots.scrollIntoView({ block: 'nearest' });
      });
    } catch (err) { $slots.innerHTML = `<div class="empty">${esc(messageFor(err.message))}</div>`; }
  }
  $view.querySelectorAll('.cal .day:not(:disabled)').forEach(c => c.onclick = () => {
    $view.querySelectorAll('.cal .day').forEach(o => o.setAttribute('aria-pressed', 'false'));
    c.setAttribute('aria-pressed', 'true'); loadSlots(c.dataset.date);
  });
  document.getElementById('attend')?.addEventListener('change', () => { if (pickedDate) loadSlots(pickedDate); });

  book.onclick = () => {
    const attendId = document.getElementById('attend')?.value || r.studentId;
    const who = S.students.find(s => s.id === attendId);
    const label = fmtJa(chosen.date) + ' ' + chosen.time;
    let extra = (chosen.gray ? '通常の枠に空きがないため臨時枠に入ります。' : '') + (attendId !== r.studentId ? `${who.name}さんが出席します。` : '');
    if ((!S.admin || S.preview) && S.students.length > 1 && S.openCount > 1 && chosen.free === 1) extra += '\nこの時間の空きは残り1枠です。お一人分のみのお取り置きとなります。';
    confirmSheet('この日時に振り替えます', `${label}${extra ? '\n' + extra : ''}`, '振り替える', async () => {
      const res = await api('transfer', { absenceId: r.id, date: chosen.date, time: chosen.time, attendStudentId: attendId });
      if (res.code !== 'OK') throw new Error(res.ttCode || res.code);
      toast(`${label} に振り替えました`); await reload();
    });
  };
}

/** 月ごとのカレンダー。allowed に含まれる日だけ押せる */
function calendarHtml({ start, end, dates }) {
  const allowed = new Set(dates);
  const todayIso = isoLocal(new Date());
  const [sy, sm] = start.split('-').map(Number), [ey, em] = end.split('-').map(Number);
  let html = '';
  for (let y = sy, m = sm; y < ey || (y === ey && m <= em); m === 12 ? (y++, m = 1) : m++) {
    const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
    let cells = '<div class="wd sun">日</div><div class="wd">月</div><div class="wd">火</div><div class="wd">水</div><div class="wd">木</div><div class="wd">金</div><div class="wd sat">土</div>';
    for (let i = 0; i < first.getDay(); i++) cells += '<button class="day blank" disabled></button>';
    for (let d = 1; d <= last.getDate(); d++) {
      const iso = isoLocal(new Date(y, m - 1, d));
      const ok = allowed.has(iso);
      cells += `<button class="day ${iso === todayIso ? 'today' : ''}" data-date="${iso}" ${ok ? 'aria-pressed="false"' : 'disabled'}>${d}</button>`;
    }
    html += `<div class="cal"><div class="m">${y}年${m}月</div><div class="g">${cells}</div></div>`;
  }
  return html;
}
function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fmtJa(iso) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${m}/${d}(${'日月火水木金土'[dt.getDay()]})`; }

function renderAdminPicker(next) {
  enter('picker', () => renderAdminPicker(next));
  const order = ['火', '水', '木', '金', '土', '日'];
  const rooms = (S.admin && S.admin.dayRooms) || {};
  const mins = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  // 曜日ごとに、生徒をいちばん早いコマの時刻で並べる（2コマの生徒は1行にまとめる）
  const byDow = {};
  order.forEach(d => { byDow[d] = []; });
  S.adminStudents.forEach(s => {
    const per = {};
    (s.slots || []).forEach(sl => { (per[sl.dow] = per[sl.dow] || []).push(sl.time); });
    Object.keys(per).forEach(d => { if (byDow[d]) byDow[d].push({ s, times: per[d].sort((a, b) => mins(a) - mins(b)) }); });
  });
  order.forEach(d => byDow[d].sort((a, b) => mins(a.times[0]) - mins(b.times[0]) || a.s.name.localeCompare(b.s.name, 'ja')));
  const days = order.filter(d => byDow[d].length);
  const todayDow = '日月火水木金土'[new Date().getDay()];
  if (!days.includes(S.pickerDow)) S.pickerDow = days.includes(todayDow) ? todayDow : days[0];

  let html = `<h2>生徒を選ぶ</h2>
    <div class="pickbar"><select id="pDow" aria-label="曜日">${days.map(d => `<option value="${d}" ${d === S.pickerDow ? 'selected' : ''}>${d}曜日</option>`).join('')}</select><span class="room" id="pRoom"></span></div>
    <input class="search" id="q" placeholder="氏名で探す（すべての曜日から）" autocomplete="off">
    <div id="list"></div>`;
  $view.innerHTML = html;
  const $list = document.getElementById('list'), $room = document.getElementById('pRoom');
  const row = (s, right) => `<div class="arow"><span class="n">${esc(s.name)}</span><span class="go">${esc(right)}</span><button class="btn" data-id="${esc(s.id)}">選ぶ</button></div>`;
  const draw = () => {
    const kw = document.getElementById('q').value.trim();
    $room.textContent = (rooms[S.pickerDow] || []).join('・');
    if (kw) {
      const hit = S.adminStudents.filter(s => s.name.includes(kw));
      $list.innerHTML = hit.length
        ? hit.map(s => row(s, (s.slots || []).map(x => `${x.dow} ${x.time}`).join('、'))).join('')
        : `<div class="empty">該当する生徒がいません</div>`;
    } else {
      // 時刻を名前の左に置き、時刻順に並べる（2コマの生徒は「16:00・17:00」）
      $list.innerHTML = (byDow[S.pickerDow] || []).map(e =>
        `<div class="arow"><span class="tm">${esc(e.times.join('・'))}</span><span class="n">${esc(e.s.name)}</span><button class="btn" data-id="${esc(e.s.id)}">選ぶ</button></div>`
      ).join('') || `<div class="empty">この曜日の生徒はいません</div>`;
    }
    $list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => (next || renderAdminStudent)(b.dataset.id));
  };
  document.getElementById('pDow').onchange = e => { S.pickerDow = e.target.value; draw(); };
  document.getElementById('q').oninput = draw;
  draw();
}

function renderMoveSlot(studentId) {
  enter('move', () => renderMoveSlot(studentId));
  const st = S.adminStudents.find(s => s.id === studentId) || { name: '', slots: [] };
  const opts = (S.admin && S.admin.slotOptions) || {};
  const today = isoLocal(new Date());
  let html = `<div class="adm">${esc(st.name)}さんの通常のコマを移動します。先に「確認」で書き換わる箇所と問題点を確かめ、問題がなければ実行できます。</div>`;
  html += `<label class="f" for="mvFrom">移動するコマ</label><select id="mvFrom">${(st.slots || []).map(x => `<option value="${esc(x.dow)}|${esc(x.time)}">${esc(x.dow)} ${esc(x.time)}</option>`).join('')}</select>`;
  html += `<label class="f" for="mvDow">移動先の曜日</label><select id="mvDow">${Object.keys(opts).map(d => `<option>${esc(d)}</option>`).join('')}</select>`;
  html += `<label class="f" for="mvTime">移動先の時刻</label><select id="mvTime"></select>`;
  html += `<label class="f" for="mvEff">変更日（この日以降の授業から移動）</label><input type="date" id="mvEff" min="${today}" value="${today}">`;
  html += `<div id="mvPlan" style="margin-top:16px"></div>`;
  html += `<div class="dock"><button class="btn primary" id="mvGo">確認する</button></div>`;
  $view.innerHTML = html;

  const $dow = document.getElementById('mvDow'), $time = document.getElementById('mvTime'), $plan = document.getElementById('mvPlan'), $go = document.getElementById('mvGo');
  const fillTimes = () => { $time.innerHTML = (opts[$dow.value] || []).map(t => `<option>${esc(t)}</option>`).join(''); };
  fillTimes();
  let planned = null;
  const params = () => { const [fromDow, fromTime] = document.getElementById('mvFrom').value.split('|'); return { studentId, fromDow, fromTime, toDow: $dow.value, toTime: $time.value, effective: document.getElementById('mvEff').value }; };
  const reset = () => { planned = null; $plan.innerHTML = ''; $go.textContent = '確認する'; $go.disabled = false; };
  ['mvFrom', 'mvDow', 'mvTime', 'mvEff'].forEach(id => document.getElementById(id).addEventListener('change', () => { if (id === 'mvDow') fillTimes(); reset(); }));

  $go.onclick = async () => {
    if (planned) {
      const p = planned;
      return confirmSheet('通常のコマを移動します', `${st.name}さん：${p.from} → ${p.to}\n${p.effective}以降の時間割 ${p.cellCount}か所と通常枠を書き換えます。`, '移動する', async () => {
        const r = await api('applyMove', params());
        if (r.code !== 'OK') { planned = null; showPlan(r.plan); throw new Error('移動できませんでした。内容を確認してください'); }
        toast('通常のコマを移動しました');
        S.admin = await api('home'); S.adminStudents = S.admin.students || [];
        goBack();
      });
    }
    $go.disabled = true; $plan.innerHTML = `<div class="loading">時間割を確認しています…</div>`;
    try { showPlan(await api('planMove', params())); } catch (e) { $plan.innerHTML = `<div class="empty">${esc(messageFor(e.message))}</div>`; $go.disabled = false; }
  };

  function showPlan(p) {
    let h = `<h2>確認結果</h2><p class="lead">${esc(p.from)} → ${esc(p.to)}（${esc(p.effective)}から）／時間割 ${p.cellCount}か所${p.sheets.length ? `（${esc(p.sheets.join('、'))}）` : ''}</p>`;
    h += p.blockers.map(b => `<div class="issue" style="border-left-color:var(--danger);background:#fbeceb"><b>止める理由</b>：${esc(b)}</div>`).join('');
    h += p.warnings.map(w => `<div class="issue"><b>注意</b>：${esc(w)}</div>`).join('');
    if (p.ok && p.newWeeks.length) h += `<p class="lead" style="margin-top:10px">移動先に書き込む授業：${esc(p.newWeeks.join('、'))}</p>`;
    if (p.ok) h += `<p class="lead">実行すると、移動元と移動先の列を上に詰めて並べ直します。ほかの生徒の欠席・振替の記録も、位置に合わせて自動で更新されます。</p>`;
    $plan.innerHTML = h;
    planned = p.ok ? p : null;
    $go.disabled = !p.ok;
    $go.textContent = p.ok ? 'この内容で移動する' : '止める理由を解消してください';
  }
}

// ---------- 確認パネル ----------
function confirmSheet(title, text, okLabel, onOk, opts = {}) {
  if (S.preview) { okLabel = 'プレビューのため送信できません'; onOk = null; }
  else if (S.admin) text += '\n（保護者へのLINE通知は送られません）';
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p style="white-space:pre-line">${esc(text)}</p>
    <button class="btn primary${opts.cancel && onOk ? ' cancel' : ''}" id="ok">${esc(okLabel)}</button><button class="btn" id="ng">戻る</button></div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.querySelector('#ng').onclick = close;
  el.onclick = e => { if (e.target === el) close(); };
  if (!onOk) el.querySelector('#ok').disabled = true;
  el.querySelector('#ok').onclick = async () => {
    if (!onOk) return;
    const b = el.querySelector('#ok'); b.disabled = true; b.textContent = '送信中…';
    try { await onOk(); close(); } catch (e) { close(); fail(e); }
  };
}

// =============================================================
// 起動
// =============================================================
(async function boot() {
  if (MOCK) { document.getElementById('mockbar').hidden = false; return loadHome(); }
  const stage = msg => { $view.innerHTML = `<div class="loading">${esc(msg)}</div>`; };
  try {
    if (typeof liff === 'undefined') throw new Error('LIFFの部品を読み込めませんでした（通信環境をご確認ください）');
    stage('LINEと接続しています…');
    await withTimeout(liff.init({ liffId: LIFF_ID }), 15000, 'LINEとの接続が完了しません（LIFFの初期化で停止）');
    if (!liff.isLoggedIn()) { stage('LINEのログイン画面へ移動しています…'); liff.login(); return; }
    stage('本人確認をしています…');
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('IDトークンが取得できません（LIFFのScopeに openid が必要です）');
    await loadHome();
  } catch (e) {
    $view.innerHTML = `<div class="empty">${esc(e.message)}<br><br><small>環境：${esc(location.host)} / LINE内:${typeof liff !== 'undefined' && liff.isInClient ? liff.isInClient() : '不明'}</small></div>`;
  }
})();

// =============================================================
// モック（?mock=1 またはブラウザ直開き）
// =============================================================
function mockApi(action, p) {
  if (window.__MOCK_ADMIN__ === true || /[?&]admin=1/.test(location.search)) return mockAdmin(action, p);
  return mockApiBase(action, p);
}
function mockApiBase(action, p) {
  const M = window.__mock || (window.__mock = {
    students: [{ id: 'S001', name: '山田太郎', room: 'A教室' }, { id: 'S002', name: '山田次郎', room: 'A教室' }],
    ledger: [
      { id: 'A1', studentId: 'S002', studentName: '山田次郎', date: '2026-08-29', dateLabel: '8/29(土)', time: '10:30', status: '未振替' },
      { id: 'A2', studentId: 'S002', studentName: '山田次郎', date: '2026-09-05', dateLabel: '9/5(土)', time: '10:30', status: '未振替' },
      { id: 'A3', studentId: 'S001', studentName: '山田太郎', date: '2026-08-22', dateLabel: '8/22(土)', time: '10:30', status: '振替済', attendStudentId: 'S001', attendStudentName: '山田太郎', transferDate: '2026-09-06', transferDateLabel: '9/6(日)', transferTime: '9:30' },
    ],
  });
  const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 350));
  const norm = r => ({ ...r, attendStudentId: r.attendStudentId || '', attendStudentName: r.attendStudentName || '', transferDate: r.transferDate || '', transferDateLabel: r.transferDateLabel || '', transferTime: r.transferTime || '', notes: r.notes || '' });
  switch (action) {
    case 'home': {
      const nextLessons = {};
      M.students.forEach(st => {
        const out = []; const t = new Date(); t.setHours(0, 0, 0, 0);
        for (let i = 0; i <= 60 && out.length < 6; i++) { const d = new Date(t); d.setDate(t.getDate() + i); if (d.getDay() !== 6) continue;
          const iso = isoLocal(d); if (M.ledger.some(r => r.studentId === st.id && r.status !== '取消' && r.date === iso)) continue;
          out.push({ date: iso, label: fmtJa(iso), time: '10:30', kind: 'regular' }); }
        M.ledger.filter(r => r.status === '振替済' && r.attendStudentId === st.id && r.transferDate >= isoLocal(t)).forEach(r => out.push({ date: r.transferDate, label: r.transferDateLabel, time: r.transferTime, kind: 'transfer', forStudentId: r.studentId }));
        out.sort((a, b) => (a.date + a.time.padStart(5, '0')).localeCompare(b.date + b.time.padStart(5, '0')));
        nextLessons[st.id] = out.slice(0, 3);
      });
      return wait({ students: M.students, ledger: M.ledger.filter(r => r.status !== '取消').map(norm), nextLessons });
    }
    case 'candidates': {
      const out = []; const t = new Date(); t.setHours(0, 0, 0, 0);
      for (let i = -35; i <= 56; i++) { const d = new Date(t); d.setDate(t.getDate() + i); if (d.getDay() !== 6) continue;
        const iso = isoLocal(d);
        out.push({ date: iso, label: fmtJa(iso), time: '10:30', isPast: d < t, alreadyRequested: M.ledger.some(r => r.studentId === p.studentId && r.status !== '取消' && r.date === iso) }); }
      return wait(out);
    }
    case 'transferDates': {
      const t = new Date(); t.setHours(0, 0, 0, 0);
      const end = new Date(t.getFullYear(), t.getMonth() + 4, 0);
      const dates = [];
      for (let d = new Date(t); d <= end; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 1) continue;
        const gap = Math.round((d - t) / 86400000); if (gap === 9 || gap === 10 || (gap >= 40 && gap <= 46)) continue; /* 休校日の例 */
        dates.push(isoLocal(d));
      }
      return wait({ start: isoLocal(t), end: isoLocal(end), dates });
    }
    case 'availability': {
      const d = new Date(p.date + 'T00:00'); const dow = d.getDay();
      const table = { 2: ['16:00', '17:00'], 3: ['16:30', '17:30'], 4: ['16:30', '17:30'], 5: ['17:30'], 6: ['9:30', '10:30', '11:30', '13:30', '14:30', '15:30', '16:30'], 0: ['9:30', '10:30', '11:30'] };
      const slots = (table[dow] || []).map((time, i) => ({ time, label: time, freeWhite: [2, 0, 1, 3, 0, 4, 2][i] || 0, freeGray: i === 1 ? 2 : 0, alreadyThere: dow === 6 && time === '10:30' }));
      return wait({ code: slots.length ? 'OK' : 'NO_DATE', slots });
    }
    case 'absence': {
      if (M.ledger.some(r => r.studentId === p.studentId && r.date === p.date && r.time === p.time && r.status !== '取消')) return wait({ code: 'DUPLICATE' });
      const s = M.students.find(x => x.id === p.studentId);
      M.ledger.push({ id: 'A' + Date.now() + Math.random(), studentId: p.studentId, studentName: s.name, date: p.date, dateLabel: fmtJa(p.date), time: p.time, status: '未振替', notes: p.notes });
      return wait({ code: 'OK', ttCode: 'OK' });
    }
    case 'transfer': {
      const r = M.ledger.find(x => x.id === p.absenceId); const a = M.students.find(x => x.id === (p.attendStudentId || r.studentId));
      Object.assign(r, { status: '振替済', attendStudentId: a.id, attendStudentName: a.name, transferDate: p.date, transferDateLabel: fmtJa(p.date), transferTime: p.time });
      return wait({ code: 'OK', ttCode: 'OK' });
    }
    case 'cancelTransfer': { const r = M.ledger.find(x => x.id === p.absenceId); Object.assign(r, { status: '未振替', attendStudentId: '', transferDate: '', transferDateLabel: '', transferTime: '' }); return wait({ code: 'OK' }); }
    case 'cancelAbsence': { const r = M.ledger.find(x => x.id === p.absenceId); r.status = '取消'; return wait({ code: 'OK' }); }
  }
  return wait({ code: 'unknown' });
}

function mockAdmin(action, p) {
  const wait = v => new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 300));
  const st = [
    { id: 'S001', name: '山田太郎', room: 'A教室', slots: [{ dow: '土', time: '10:30' }] },
    { id: 'S002', name: '山田次郎', room: 'A教室', slots: [{ dow: '土', time: '10:30' }] },
    { id: 'S010', name: '鈴木一郎', room: 'B教室', slots: [{ dow: '火', time: '16:00' }, { dow: '火', time: '17:00' }] },
    { id: 'S011', name: '佐藤花子', room: 'A教室', slots: [{ dow: '土', time: '9:30' }] },
    { id: 'S012', name: '高橋健', room: 'A教室', slots: [{ dow: '土', time: '13:30' }] },
  ];
  if (action === 'home') return wait({ admin: true, name: '先生', students: st, dayRooms: { '火': ['A教室'], '水': ['A教室'], '木': ['A教室'], '金': ['B教室'], '土': ['A教室', 'B教室'], '日': ['A教室'] }, slotOptions: { '火': ['16:00', '17:00'], '水': ['16:30', '17:30'], '木': ['16:30', '17:30'], '金': ['17:30'], '土': ['9:30', '10:30', '11:30', '13:30', '14:30', '15:30', '16:30'], '日': ['9:30', '10:30', '11:30'] }, overview: {
    openTotal: 4, summary: [
      { studentId: 'S002', name: '山田次郎', count: 2, oldest: '2026-08-29', items: [] },
      { studentId: 'S010', name: '鈴木一郎', count: 2, oldest: '2026-09-01', items: [] },
    ],
    upcoming: [{ id: 'A3', date: '2026-09-12', label: '9/12(土)', time: '9:30', attendName: '山田太郎', forName: '山田太郎' }],
  } });
  if (action === 'previewHome') return mockApiBase('home', p);
  if (action === 'planMove' || action === 'applyMove') {
    const plan = { ok: p.toDow !== '日', blockers: p.toDow === '日' ? ['10/18(日) ' + p.toTime + '：白い空き枠がありません（臨時枠のみ）'] : [], warnings: ['時間割（原本）の2週目は確認済みです（モック）'],
      from: `${p.fromDow} ${p.fromTime}`, to: `${p.toDow} ${p.toTime}`, effective: fmtJa(p.effective), cellCount: 12, sheets: ['時間割（原本）', '2026年10月', '2026年11月'], newWeeks: ['10/14(水) 16:30', '10/21(水) 16:30'] };
    return wait(action === 'planMove' ? plan : { code: plan.ok ? 'OK' : 'BLOCKED', plan });
  }
  if (action === 'integrity') return wait([{ id: 'A9', who: '鈴木一郎', msg: '9/1(火) 17:00 の欠席セル（2026年9月!D14）の中身が「鈴木二郎CA」でずれています' }]);
  if (action === 'ledgerOf') return wait([
    { id: 'A1', studentId: p.studentId, date: '2026-08-29', dateLabel: '8/29(土)', time: '10:30', status: '未振替', attendStudentId: '', attendStudentName: '', transferDate: '', transferDateLabel: '', transferTime: '', notes: '' },
  ]);
  return mockApiBase(action, p);
}
